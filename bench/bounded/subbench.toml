[[patterns]]
# The ambiguous nest over LETTERS, bounded so the oracle finishes it: every
# letter run longer than 36 is a near-miss a backtracker decomposes 7^6 ways
# (about 1.7 ms on the interpreter, measured while designing the set). The
# hazard-band MATCH row; the digit nests above are its compile-axis kin.
name = "nest2-letters-6"
file = "patterns/nest2-letters-6.rx"
feature_tier = "base"
hazard_class = "ambiguous-decomposition"
size_class = "small"
convention = "perl-leftmost-first"
tags = ["ladder", "nested", "depth-2", "class-body", "hazard", "tier-base"]
role = "member"

[[patterns]]
# THE FLOOR PATTERN (requirements 5, the rule since [B15]): one literal byte,
# `role = "floor"`, run over the same subjects as the members so their
# per-call numbers read against the harness's own per-call overhead. `:` is
# in every line's timestamp within its first 12 bytes; it is absent from
# most fields and from every run, where the floor is a memchr-class miss
# over the subject (NOTES.md, "The floor pattern", states the m/n).
name = "floor"
file = "patterns/floor.rx"
feature_tier = "base"
hazard_class = "none"
size_class = "tiny"
convention = "perl-leftmost-first"
tags = ["floor", "control", "one-literal"]
role = "floor"

[subjects]
generator = "gen_subjects.py"
manifest = "manifest.tsv"
throughput_generator = "gen_throughput_subjects.py"
throughput_manifest = "manifest_throughput.tsv"
# 512: every field, line and small run (3-257 B) is in the search band, so
# the two short regimes see the same 30 subjects. The lines themselves are
# held to <= 256 B by the generator (requirements 3's "~256-byte subjects"
# for this regime, bench/email's band); 512 rather than 256 only so the
# 257-byte over-run of the 256 rung is not dropped from search by one byte.
short_search_max_bytes = 512

[expectations]
file = "expectations.tsv"
default_method = "libpcre2-differential"

# Per-testee notes. No testee runs a VARIANT of any pattern in this sub-bench:
# all twenty-four are canonical PCRE2 spellings and every adapter runs the
# canonical text (requirements 4.5 -- the record still STATES that, as
# `patterns[].variant = null`). `options` is empty for both engines: the
# patterns carry their own semantics inline and neither adapter passes a
# compile option. See NOTES.md.
[testees.pcre2]
options = {}

[testees.pcrec]
options = {}
# Four patterns use `\b` (`assertions` module, built but not in `std1`);
# `--features all` is already on every pcrec testee config -- a flag of the
# TESTEE, not a variant of the pattern. A REFUSAL on a large-count rung is
# an expected, first-class `did-not-compile` outcome of this set (NOTES.md,
# "The ladder and the predicted first refusal"), never a testee note.
