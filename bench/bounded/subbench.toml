# The bounded-repeat sub-bench SIDECAR (harness contract 2, requirements 5).
# Fields only, no grammar, no directives, no includes -- [DD-13]'s territory
# is deliberately untouched, so the unified format absorbs this mechanically
# when it lands.

id = "bounded"
version = "0.3"
objective_kind = "hazard"
objective = """\
Bounded repeats on both axes: what an engine pays to COMPILE a counted \
repeat as the count grows, nests and changes body (a literal, a class, a \
group) -- through to the count at which it refuses, which is a first-class \
outcome and the number the count ladder exists to locate -- and what it \
pays to MATCH the everyday bounded shapes (fixed-width fields, hex ids, \
length rules, nested octet counts) and the hazard-band ones (a bounded lazy \
gap before a word-boundary alternation; an ambiguous nested count) on \
subjects that match, that fail at the last repetition, and that over-run \
the count and fail only at the end anchor."""
description = """\
Forty-three patterns in three families. TEN everyday bounded shapes: a 4-digit \
year, a 32-hex id, a password length rule `.{8,64}`, a line-length rule \
`.{80,}`, a dotted quad `(?:\\d{1,3}\\.){3}\\d{1,3}`, a five-field CSV \
record, and a bounded-context shape `\\b(?:fail|abort|panic)\
\\b.{0,N}?\\b(?:disk|memory|socket|quota)\\b` as a count ladder N = 64 / 256 \
/ 1024 plus its greedy twin at 256, and (since 0.3) the SHORT-RUN DIGIT \
FAMILY that shapes `year4` into a ladder: `\\d{k}` at k = 2 / 8 / 16 / 32 \
beside its `\\d{1,k}` twin at k = 2 / 4 / 8 / 16 / 32, the instrument the \
per-run edge-selection boundary is read off. TWENTY-THREE count-ladder \
rungs on a few \
skeletons: `[a-z]{0,n}` for n = 4 .. 65535 (fifteen geometric rungs -- \
eleven since 0.2 to PCRE2's own ceiling, four LOW rungs since 0.3), the \
open `{n,}`, the lazy `{0,n}?`, a group body `(?:a|[b-z]){0,1024}` beside \
the class rung at the same count (the 0.2 group-vs-class pair), two- \
and three-deep nests `(?:\\d{1,k}){1,k}`, and one ambiguous nest over \
letters whose near-misses a backtracker pays for. Plus the floor. \
Subjects: 13 whole-string FIELDS (each shape's exact match, its near-miss \
at the last repetition, its over-run), 8 LINES of near-miss ops prose \
(43-256 B) carrying the shapes in an allocated minority and the \
trigger/context pairs at designed gaps, 24 RUNS of random letters or digits \
sitting on the ladder's rungs and one off them (1-1024 B; 15 of them added \
by 0.3 -- letters at 64 / 128 / 512 / 1024 as the MATCH regime's per-rung \
whole-subject matches, digits as a 1 .. 33 length ladder plus a 1024 B \
control, the three longest MATCH-ONLY because they exceed \
`short_search_max_bytes`), and five \
LARGE runs (4 / 16 / 64 KB letters, 4 / 16 KB digits) in a `throughput` \
regime that is the \
ladder's top rungs driven to their full count, not a size sweep -- the \
sweep here is the COUNT, in the patterns. The set is sized to the \
harness's batched-loop protocol (NOTES.md, "Cell-time estimate"), which is \
why the longest match-only run is 1024 B and not 16 KB. See NOTES.md for the pattern \
table with m/n, the ladder and the predicted first-refusal counts, the \
oracle's own limits, and the cell-time estimate."""

# All three. `throughput` here is NOT a size sweep (NOTES.md, "Regimes"):
# the give-up axis this set sweeps is the COUNT in the pattern, and inbox
# I-2 1(b)'s "the size at which it first fires" is here "the count at which
# it first fires", which lives in the count ladder. The four throughput
# subjects are the LARGE rungs' runs (4 KB / 16 KB / 64 KB), placed in their
# own regime so the ladder's top counts are driven to their full value under
# find-all search without a 16 KB subject sitting in a match set whose
# median is 40 B (gen_throughput_subjects.py says why that matters).
regimes = ["match", "search_short", "throughput"]

# THE MEMBERS. `feature_tier`: `base` is pcrec's frozen `std1` set; the four
# `ctx-*` rungs use `\b` (the `assertions` module, built but not in `std1`),
# which every pcrec testee already passes `--features all` for -- a TESTEE
# flag, not a pattern variant; the text is byte-identical either way.
# `hazard_class` is the schema's enum: `exact-minimum-boundary` for the
# fixed-width everyday shapes whose near-misses fail one repetition short,
# `large-count` for the ladder, `ambiguous-decomposition` for the lazy gap
# and the nests. `size_class` is the PATTERN's byte size (tiny < 16 B, small
# < 64, medium < 256).

