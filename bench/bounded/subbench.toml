# ---- the short-run digit family (0.3) ----

# 0.3 ([B27], inbox I-29 ask (ii), bundled with ask (v)): `year4` and
# `dotted4` shaped as a LADDER. The acceptance ledger measured a per-call
# entry cost of x1.07-1.11 on `year4` (a 4-count digit run) where pcrec's
# own digits control stated x1.08, and the hybrid-gained-edge census
# (docs/dev/measurements/2026-09-01-hybrid-gained-edge-census.md) resolved
# that term into a FIXED +6..+12 ns paid per matching call -- so the number
# that decides a skip-below-k knob is the COUNT at which the run is long
# enough to pay for it, and no ladder existed to read it off. This family is
# that ladder: `\d{k}` at k = 2 / 8 / 16 / 32 (k = 4 is `year4` itself,
# byte for byte, and completes the rung set) beside its `\d{1,k}` twin at
# k = 2 / 4 / 8 / 16 / 32. The pair at each rung separates a FIXED-width run
# from a BOUNDED one: same class, same maximum, different certainty about
# the length. Their subjects are 0.3's digit length ladder, where for each
# rung one subject matches exactly, one is a near-miss one short, and one
# over-runs (NOTES.md, "What 0.3 added").

