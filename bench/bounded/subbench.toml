# 258 (was 512 through 0.2, with NO change of membership: every 0.2 subject
# is <= 257 B, so the same 30 are in the search band either way). The cap
# earns a SECOND job in 0.3: `subbench.subjects_for()` filters `search_short`
# by it and does NOT filter `match` at all, so a subject longer than the cap
# is MATCH-ONLY -- which is the whole mechanism behind 0.3's long letters and
# digit runs (NOTES.md, "What 0.3 added": no new regime, no schema change).
# 258 is still the 0.2 number's own rationale to the byte: one more than the
# 257-byte over-run of the 256 rung, so that subject is not dropped from the
# search band by one byte.
short_search_max_bytes = 258

[expectations]
file = "expectations.tsv"
default_method = "libpcre2-differential"

# Per-testee notes. No testee runs a VARIANT of any pattern in this sub-bench:
# all twenty-four are canonical PCRE2 spellings and every adapter runs the
# canonical text (requirements 4.5 -- the record still STATES that, as
# `patterns[].variant = null`). `options` is empty for both engines: the
# patterns carry their own semantics inline and neither adapter passes a
# compile option. See NOTES.md.
[testees.pcre2]
options = {}

[testees.pcrec]
options = {}
# Four patterns use `\b` (`assertions` module, built but not in `std1`);
# `--features all` is already on every pcrec testee config -- a flag of the
# TESTEE, not a variant of the pattern. A REFUSAL on a large-count rung is
# an expected, first-class `did-not-compile` outcome of this set (NOTES.md,
# "The ladder and the predicted first refusal"), never a testee note.
