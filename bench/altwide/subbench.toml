name = "sh1-512"
file = "patterns/sh1-512.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "large"
convention = "perl-leftmost-first"
tags = ["structure", "shared-first-byte", "tier-base"]
role = "member"

[[patterns]]
# The same lever three bytes deep: every branch starts `qux`.
name = "pfx3-512"
file = "patterns/pfx3-512.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "large"
convention = "perl-leftmost-first"
tags = ["structure", "shared-prefix-3", "tier-base"]
role = "member"

[[patterns]]
name = "sfx-64"
file = "patterns/sfx-64.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "medium"
convention = "perl-leftmost-first"
tags = ["structure", "shared-suffix", "required-code-unit", "tier-base"]
role = "member"

[[patterns]]
# Every branch ENDS `ing`: the only shape in the set that gives PCRE2 a
# required code unit, and so the only one where a required-byte precheck can
# dismiss a subject without scanning it (bench/loglines' axis, at width).
name = "sfx-512"
file = "patterns/sfx-512.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "large"
convention = "perl-leftmost-first"
tags = ["structure", "shared-suffix", "required-code-unit", "tier-base"]
role = "member"

[[patterns]]
name = "nar4-64"
file = "patterns/nar4-64.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "medium"
convention = "perl-leftmost-first"
tags = ["structure", "narrow-first-byte-set", "tier-base"]
role = "member"

[[patterns]]
# Four first bytes: a start bitmap with four bits set, between `sh1-512`'s
# one byte and `w-512`'s twenty-six.
name = "nar4-512"
file = "patterns/nar4-512.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "large"
convention = "perl-leftmost-first"
tags = ["structure", "narrow-first-byte-set", "tier-base"]
role = "member"

# ---- order

[[patterns]]
# `w-512`'s OWN 512 branches, sorted by first byte. Same language, same
# branch set, same width, same bytes to within the reordering -- the
# longest run of adjacent branches sharing a first byte goes from 2 to
# about 30, and each subject's hit moves to a different branch INDEX.
name = "srt-512"
file = "patterns/srt-512.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "large"
convention = "perl-leftmost-first"
tags = ["order", "sorted", "control-pair", "tier-base"]
role = "member"

# ---- wrappers

[[patterns]]
# `w-512` under `(?i)`. `modifiers` is in pcrec's `std1`, so this is
# feature_tier `base` and needs no testee flag.
name = "ci-512"
file = "patterns/ci-512.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "large"
convention = "perl-leftmost-first"
tags = ["wrapper", "caseless", "control-pair", "tier-base"]
role = "member"

[[patterns]]
# `w-64` under a bounded count: the bridge to bench/bounded, where the
# counter rung and the alternation width multiply.
name = "cnt-64"
file = "patterns/cnt-64.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "medium"
convention = "perl-leftmost-first"
tags = ["wrapper", "bounded-count", "bridge-bounded", "control-pair", "tier-base"]
role = "member"

[[patterns]]
# `w-512` inside `\b...\b`: the same 512 branches as whole words only.
name = "wb-512"
file = "patterns/wb-512.rx"
feature_tier = "base+assertions"
hazard_class = "wide-alternation"
size_class = "large"
convention = "perl-leftmost-first"
tags = ["wrapper", "word-boundary", "control-pair", "tier-assertions"]
role = "member"

[[patterns]]
# THE FLOOR PATTERN (requirements 5, the rule since [B15]): one literal
# byte, `role = "floor"`, run over the same subjects as the members so
# their per-call numbers read against the harness's own per-call overhead.
# `#` opens every LINE and occurs nowhere else in the set, so the floor is
# a hit at offset 0 on every line, a whole-subject miss on every field, and
# a full-length memchr MISS over every throughput subject -- three readings
# of the overhead from one pattern (NOTES.md, "The floor pattern").
name = "floor"
file = "patterns/floor.rx"
feature_tier = "base"
hazard_class = "none"
size_class = "tiny"
convention = "perl-leftmost-first"
tags = ["floor", "control", "one-literal"]
role = "floor"

[subjects]
generator = "gen_subjects.py"
manifest = "manifest.tsv"
throughput_generator = "gen_throughput_subjects.py"
throughput_manifest = "manifest_throughput.tsv"
# 512: every field (4-18 B) and every line (<= 256 B) is inside the search
# band, so the two short regimes see the same 38 subjects. The lines
# themselves are held to <= 256 B by the generator (requirements 3's
# "~256-byte subjects" for this regime, bench/email's band); 512 rather
# than 256 is headroom, not a wider band.
short_search_max_bytes = 512

[expectations]
file = "expectations.tsv"
default_method = "libpcre2-differential"

# Per-testee notes. No testee runs a VARIANT of any pattern in this
# sub-bench: all twenty are canonical PCRE2 spellings and every adapter runs
# the canonical text (requirements 4.5 -- the record still STATES that, as
# `patterns[].variant = null`). `options` is empty for both engines: the
# patterns carry their own semantics inline and neither adapter passes a
# compile option. See NOTES.md.
[testees.pcre2]
options = {}

[testees.pcrec]
options = {}
# One pattern uses `\b` (`assertions` module, built but not in `std1`);
# `--features all` is already on every pcrec testee config -- a flag of the
# TESTEE, not a variant of the pattern. A REFUSAL on a wide rung is an
# expected, first-class `did-not-compile` outcome of this set (NOTES.md,
# "What the ladder brackets"), never a testee note.
