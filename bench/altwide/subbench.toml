# The wide-alternation sub-bench SIDECAR (harness contract 2, requirements 5).
# Fields only, no grammar, no directives, no includes -- [DD-13]'s territory
# is deliberately untouched, so the unified format absorbs this mechanically
# when it lands.

id = "altwide"
version = "0.2"
objective_kind = "hazard"
objective = """\
Alternations of MANY literal branches, on both axes: what an engine pays to \
COMPILE one as the branch count grows -- through to the width at which it \
refuses, a first-class outcome and the number the width ladder exists to \
locate -- and what it pays to SEARCH mostly-failing prose with one, as the \
STRUCTURE that decides a start-of-match optimization changes underneath it: \
branches sharing one first byte, sharing three, spread over the whole \
alphabet, drawn from four, or sharing a suffix instead of a prefix. Crossed \
with the two things only a leftmost-first engine pays for -- which branch \
INDEX carries the hit, and what ORDER the branches are written in."""
description = """\
Thirty-three patterns on four axes (twenty at 0.1; thirteen added at 0.2, \
which changed nothing else -- every 0.1 pattern keeps its id and its exact \
bytes, every 0.1 subject reproduces byte for byte, and every 0.1 \
expectation row is unchanged). WIDTH: twelve rungs of nested slices of two \
word pools -- `w-8`, `w-64`, `w-96`, `w-128`, `w-192`, `w-256`, `w-384`, \
`w-512`, `w-1024`, `w-2048` over 3-12 byte branches, and `s-256`, `s-512`, \
`s-2048`, `s-4096` over 3-6 byte ones, because libpcre2 itself REFUSES a \
4096-way alternation of 3-12 byte words ("regular expression is too large", \
its LINK_SIZE ceiling; `oracle_limits.tsv` carries the probe) and an \
expectation the oracle cannot state is a cell the harness cannot judge. \
0.2 densified 64..512 to a uniform factor of about 1.4, so a knee anywhere \
in the band an AOT compiler is known to compile is bracketed within 1.5x \
rather than within 4x, and `s-256` / `s-512` put the branch-LENGTH pair at \
widths where it can be read (0.1 carried it only at 2048). STRUCTURE, at 64, \
at the 256 ANCHOR and at 512: `sh1-*` (every branch starts `k`), `pfx3-*` \
(every branch starts `qux`), `nar4-*` (four first bytes), `sfx-*` (every \
branch ENDS `ing` -- the only patterns here with a PCRE2 required code \
unit). ORDER: `srt-256` and `srt-512` are `w-256`'s and `w-512`'s own \
branches sorted by first byte, which takes the longest run of adjacent \
branches sharing a first byte from 2 to about 15 and 30 while leaving the \
language identical (the pools are substring-free, so leftmost-first cannot \
return a different span). WRAPPERS: `ci-256` / `ci-512` under `(?i)`, \
`cnt-64` under a bounded count `{1,3}` (the bridge to bench/bounded), \
`wb-256` / `wb-512` inside `\\b...\\b`. Plus the floor. \
Subjects: 18 whole-string FIELDS (one branch from every rung and every \
structure pool, plus four designed misses -- a one-byte substitution, a \
proper prefix, a branch buried in a longer letter run, a word in no pool), \
22 LINES of <= 256 B prose whose background is BRANCH-FREE BY CONSTRUCTION \
and asserted per subject, thirteen of them carrying one branch at a designed \
POSITION (early / mid / last) and a designed branch INDEX, and four large \
prose subjects crossing hit DENSITY (0, 1 per 8 KB, 1 per 128 B) with SIZE \
(128 KB, 512 KB). See NOTES.md for the pattern table, what the ladder \
brackets, the predictions, the oracle's own width ceiling and the \
cell-time estimate."""

# All three. `throughput` here IS a size sweep in part -- `t-512k-sparse`
# is `t-128k-sparse`'s density at four times the bytes -- but its first
# axis is hit DENSITY at one size, because under find-all search a wide
# alternation's cost splits into a failing scan (per byte, per branch on a
# backtracker) and a cost at the hit (the branch INDEX on a backtracker),
# and only two densities at one size separate them. The give-up axis this
# set sweeps is the WIDTH, and that lives in the patterns.
regimes = ["match", "search_short", "throughput"]

# THE MEMBERS. `feature_tier`: `base` is pcrec's frozen `std1` set, which is
# {classes, modifiers} -- so `(?i)` on `ci-512` is BASE (the `modifiers`
# module) and needs no flag. `wb-512`'s `\b` is the `assertions` module,
# built but not in `std1`, which every pcrec testee already passes
# `--features all` for -- a TESTEE flag, not a pattern variant; the text is
# byte-identical either way. `hazard_class` is `wide-alternation` for every
# member (the schema enum already carries it), `none` for the floor.
# `size_class` bands the PATTERN's own byte size, and this set extends
# bench/bounded's bands upward because its patterns are three orders of
# magnitude larger: tiny < 16 B, small < 256, medium < 4096, large < 16384,
# huge >= 16384.

# ---- the width ladder: nested slices of the `main` pool, spread first
# ---- bytes, generation order (adjacent branches share a first byte in
# ---- runs of 1-3)

