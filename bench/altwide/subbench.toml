# The wide-alternation sub-bench SIDECAR (harness contract 2, requirements 5).
# Fields only, no grammar, no directives, no includes -- [DD-13]'s territory
# is deliberately untouched, so the unified format absorbs this mechanically
# when it lands.

id = "altwide"
version = "0.1"
objective_kind = "hazard"
objective = """\
Alternations of MANY literal branches, on both axes: what an engine pays to \
COMPILE one as the branch count grows -- through to the width at which it \
refuses, a first-class outcome and the number the width ladder exists to \
locate -- and what it pays to SEARCH mostly-failing prose with one, as the \
STRUCTURE that decides a start-of-match optimization changes underneath it: \
branches sharing one first byte, sharing three, spread over the whole \
alphabet, drawn from four, or sharing a suffix instead of a prefix. Crossed \
with the two things only a leftmost-first engine pays for -- which branch \
INDEX carries the hit, and what ORDER the branches are written in."""
description = """\
Twenty patterns on four axes. WIDTH: eight rungs of nested slices of one \
word pool -- `w-8`, `w-64`, `w-256`, `w-512`, `w-1024`, `w-2048` over \
3-12 byte branches, and `s-2048`, `s-4096` over 3-6 byte branches, because \
libpcre2 itself REFUSES a 4096-way alternation of 3-12 byte words \
("regular expression is too large", its LINK_SIZE ceiling; \
`oracle_limits.tsv` carries the probe) and an expectation the oracle cannot \
state is a cell the harness cannot judge. STRUCTURE, at two widths where it \
is affordable: `sh1-*` (every branch starts `k`), `pfx3-512` (every branch \
starts `qux`), `nar4-*` (four first bytes), `sfx-*` (every branch ENDS \
`ing` -- the only patterns here with a PCRE2 required code unit). ORDER: \
`srt-512` is `w-512`'s own 512 branches sorted by first byte, which takes \
the longest run of adjacent branches sharing a first byte from 2 to about \
30 while leaving the language identical (the pools are substring-free, so \
leftmost-first cannot return a different span). WRAPPERS: `ci-512` under \
`(?i)`, `cnt-64` under a bounded count `{1,3}` (the bridge to \
bench/bounded), `wb-512` inside `\\b...\\b`. Plus the floor. \
Subjects: 17 whole-string FIELDS (one branch from every rung and every \
structure pool, plus four designed misses -- a one-byte substitution, a \
proper prefix, a branch buried in a longer letter run, a word in no pool), \
21 LINES of <= 256 B prose whose background is BRANCH-FREE BY CONSTRUCTION \
and asserted per subject, twelve of them carrying one branch at a designed \
POSITION (early / mid / last) and a designed branch INDEX, and four large \
prose subjects crossing hit DENSITY (0, 1 per 8 KB, 1 per 128 B) with SIZE \
(128 KB, 512 KB). See NOTES.md for the pattern table, what the ladder \
brackets, the predictions, the oracle's own width ceiling and the \
cell-time estimate."""

# All three. `throughput` here IS a size sweep in part -- `t-512k-sparse`
# is `t-128k-sparse`'s density at four times the bytes -- but its first
# axis is hit DENSITY at one size, because under find-all search a wide
# alternation's cost splits into a failing scan (per byte, per branch on a
# backtracker) and a cost at the hit (the branch INDEX on a backtracker),
# and only two densities at one size separate them. The give-up axis this
# set sweeps is the WIDTH, and that lives in the patterns.
regimes = ["match", "search_short", "throughput"]

# THE MEMBERS. `feature_tier`: `base` is pcrec's frozen `std1` set, which is
# {classes, modifiers} -- so `(?i)` on `ci-512` is BASE (the `modifiers`
# module) and needs no flag. `wb-512`'s `\b` is the `assertions` module,
# built but not in `std1`, which every pcrec testee already passes
# `--features all` for -- a TESTEE flag, not a pattern variant; the text is
# byte-identical either way. `hazard_class` is `wide-alternation` for every
# member (the schema enum already carries it), `none` for the floor.
# `size_class` bands the PATTERN's own byte size, and this set extends
# bench/bounded's bands upward because its patterns are three orders of
# magnitude larger: tiny < 16 B, small < 256, medium < 4096, large < 16384,
# huge >= 16384.

# ---- the width ladder: nested slices of the `main` pool, spread first
# ---- bytes, generation order (adjacent branches share a first byte in
# ---- runs of 1-3)

[[patterns]]
name = "w-8"
file = "patterns/w-8.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "small"
convention = "perl-leftmost-first"
tags = ["ladder", "width", "spread-first-byte", "tier-base"]
role = "member"

[[patterns]]
name = "w-64"
file = "patterns/w-64.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "medium"
convention = "perl-leftmost-first"
tags = ["ladder", "width", "spread-first-byte", "structure-anchor", "tier-base"]
role = "member"

[[patterns]]
# 256 and 512 BRACKET, within 2x, the width at which a forward machine's
# `states x classes` is predicted to cross an emitter's 16-bit
# table-encoding bound (NOTES.md, "What the ladder brackets").
name = "w-256"
file = "patterns/w-256.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "medium"
convention = "perl-leftmost-first"
tags = ["ladder", "width", "spread-first-byte", "knee", "tier-base"]
role = "member"

[[patterns]]
# The ANCHOR width: every structure arm, the order arm and two of the three
# wrappers are 512 branches wide, so structure/order/wrapper are read
# against this row and not against each other.
name = "w-512"
file = "patterns/w-512.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "large"
convention = "perl-leftmost-first"
tags = ["ladder", "width", "spread-first-byte", "knee", "structure-anchor", "tier-base"]
role = "member"

[[patterns]]
name = "w-1024"
file = "patterns/w-1024.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "large"
convention = "perl-leftmost-first"
tags = ["ladder", "width", "spread-first-byte", "knee", "tier-base"]
role = "member"

[[patterns]]
# The widest rung libpcre2 accepts at 3-12 byte branches; 4096 is refused
# (`oracle_limits.tsv`). 1024 and 2048 bracket the width at which a
# branch-per-node VM lowering is predicted to cross an emitted-size cap.
name = "w-2048"
file = "patterns/w-2048.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "huge"
convention = "perl-leftmost-first"
tags = ["ladder", "width", "spread-first-byte", "knee", "ceiling", "tier-base"]
role = "member"

# ---- the short-word ladder: the same spread structure at 3-6 byte
# ---- branches, which is how the set reaches 4096 at all

[[patterns]]
# The controlled pair for `w-2048`: same width, same first-byte spread,
# branch LENGTH is the only thing that moved.
name = "s-2048"
file = "patterns/s-2048.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "large"
convention = "perl-leftmost-first"
tags = ["ladder", "width", "short-branches", "spread-first-byte", "length-pair", "tier-base"]
role = "member"

[[patterns]]
# The brief's 4096-way alternation, and the widest pattern in the set.
name = "s-4096"
file = "patterns/s-4096.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "huge"
convention = "perl-leftmost-first"
tags = ["ladder", "width", "short-branches", "spread-first-byte", "ceiling", "tier-base"]
role = "member"

# ---- structure: what a start-of-match analysis can see

[[patterns]]
name = "sh1-64"
file = "patterns/sh1-64.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "medium"
convention = "perl-leftmost-first"
tags = ["structure", "shared-first-byte", "tier-base"]
role = "member"

[[patterns]]
# Every branch starts `k`: PCRE2 reports a first CODE UNIT rather than a
# start bitmap, and a prefix-factoring pass sees ONE maximal run as wide as
