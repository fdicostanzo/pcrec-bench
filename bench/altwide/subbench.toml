[[patterns]]
# THE FLOOR PATTERN (requirements 5, the rule since [B15]): one literal
# byte, `role = "floor"`, run over the same subjects as the members so
# their per-call numbers read against the harness's own per-call overhead.
# `#` opens every LINE and occurs nowhere else in the set, so the floor is
# a hit at offset 0 on every line, a whole-subject miss on every field, and
# a full-length memchr MISS over every throughput subject -- three readings
# of the overhead from one pattern (NOTES.md, "The floor pattern").
name = "floor"
file = "patterns/floor.rx"
feature_tier = "base"
hazard_class = "none"
size_class = "tiny"
convention = "perl-leftmost-first"
tags = ["floor", "control", "one-literal"]
role = "floor"

[subjects]
generator = "gen_subjects.py"
manifest = "manifest.tsv"
throughput_generator = "gen_throughput_subjects.py"
throughput_manifest = "manifest_throughput.tsv"
# 512: every field (4-18 B) and every line (<= 256 B) is inside the search
# band, so the two short regimes see the same 38 subjects. The lines
# themselves are held to <= 256 B by the generator (requirements 3's
# "~256-byte subjects" for this regime, bench/email's band); 512 rather
# than 256 is headroom, not a wider band.
short_search_max_bytes = 512

[expectations]
file = "expectations.tsv"
default_method = "libpcre2-differential"

# Per-testee notes. No testee runs a VARIANT of any pattern in this
# sub-bench: all twenty are canonical PCRE2 spellings and every adapter runs
# the canonical text (requirements 4.5 -- the record still STATES that, as
# `patterns[].variant = null`). `options` is empty for both engines: the
# patterns carry their own semantics inline and neither adapter passes a
# compile option. See NOTES.md.
[testees.pcre2]
options = {}

[testees.pcrec]
options = {}
# One pattern uses `\b` (`assertions` module, built but not in `std1`);
# `--features all` is already on every pcrec testee config -- a flag of the
# TESTEE, not a variant of the pattern. A REFUSAL on a wide rung is an
# expected, first-class `did-not-compile` outcome of this set (NOTES.md,
# "What the ladder brackets"), never a testee note.
