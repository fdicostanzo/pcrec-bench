# The capability survey set's SIDECAR (harness contract 2, requirements 5).
# Fields only, no grammar, no directives, no includes -- [DD-13]'s territory
# is deliberately untouched here, exactly as bench/syntax's own sidecar
# states it (the pattern SOURCE lives in patterns.rxt, per Frank's Q3
# ruling, docs/design/capability_set_v1.md 9; this file's `[[patterns]]`
# array is DERIVED from gen_patterns.py's own table, which is itself
# derived from patterns.rxt + curation/ -- `gen_patterns.py --sidecar`
# prints it, `--check` compares it entry for entry).

id = "capability"
version = "0.1"
objective_kind = "feature"
objective = """\
A CAPABILITY CONTRAST across the [B7] engine roster: what each engine can \
EXPRESS, what it REFUSES, and what the expressible patterns COST -- over a \
set built from real, deployed regex shapes wherever a permissive-licensed \
source could be fetched (OWASP's validation repository and CRS ruleset, \
Elastic's grok patterns, rebar's wild corpora, VS Code's JSON grammar, \
PCRE2's and rust-regex's own test corpora) and authored fresh, held to the \
SAME realism rule, where none exists (backreference, lookaround, \
recursion, ReDoS and non-UTF-8 shapes a real author would plausibly write \
for that purpose -- Frank's Q2 ruling, 2026-09-12: 'from the wild' is a \
REALISM framing, not a ratio to hit). BUILT ON pcrec's `.rxt` format as \
this set's pattern source of truth (Frank's Q3 ruling), the first \
pcrec-bench set authored that way. See docs/design/capability_set_v1.md \
and NOTES.md."""
description = """\
Sixty-four patterns (63 members + the floor) across twelve provenance/ \
capability families: six WILD families built from imported, \
provenance-tracked patterns (wild-validator, wild-logparse, wild-waf, \
wild-secrets, wild-datetime, wild-codegrammar) and six \
CAPABILITY/HAZARD families of designed members probing one closed \
REQUIRES tag each (cap-backref, cap-lookaround, cap-recursion, \
redos-nested, semantics-divergence, binary-nonutf8), plus the floor. \
Every pattern carries a native `.rxt` `provenance` sub-block (source, \
licence, fidelity, adaptation) and a `tag family=/hazard=/requires=` \
classification; the source of truth is patterns.rxt (`--list-source` \
clean), LOADED as such since the [B42] sidecar switch (2026-09-16, pin \
a770139e: the `rxt_source =` key below; pcrecbench/rxt_source.py), with \
patterns/*.rx a derived export kept for reference. See NOTES.md for the \
family table, the twin-pairing reconciliation, the outlier rule and the \
predictions, all stated before any run."""

# `search_short` + `throughput` ONLY, per Frank's own ruling recorded in
# capability_set_v1.md 3.5: `match` (the whole-subject compliance regime)
# is excluded set-wide in v1 -- pcrec's own lexical `(?:pattern)\z` wrapper
# has three documented defects (a `(?R)` recursing into the wrapper, a
# `(?x)` comment eating the close, `\K` unable to report a non-zero start)
# that families 6 and 9 here would inherit directly, per the syntax
# census's own first-sample finding this design note cites verbatim.
regimes = ["search_short", "throughput"]
# [B42] THE SIDECAR SWITCH (runbook step 5, 2026-09-16, at pin a770139e —
# the O-29 fix pin): patterns.rxt is now LOADED as the pattern source
# (pcrecbench/rxt_source.py via the pinned `pcrec --list-source`), not
# merely declared; patterns/*.rx remain a derived export. Parked on O-29
# until this pin; the loader's provenance-agreement gate (64/64) is the
# refuse→load flip's witness.
rxt_source = "patterns.rxt"

[subjects]
generator = "gen_subjects.py"
manifest = "manifest.tsv"
throughput_generator = "gen_throughput_subjects.py"
throughput_manifest = "manifest_throughput.tsv"
# Real-world pattern bodies (a CRS rule, a syslog line, a validator hit)
# run longer than the syntax census's 2-14 B fields; 512 keeps every typed
# short subject inside the band while staying well under altwide's own 512
# precedent for a similar reason.
short_search_max_bytes = 512

[expectations]
file = "expectations.tsv"
default_method = "libpcre2-differential"

