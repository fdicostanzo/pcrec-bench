# The UTF-8 encoding set's SIDECAR (harness contract 2, requirements 5).
# Fields only, no grammar, no directives, no includes -- the pattern SOURCE
# lives in patterns.rxt ([B77] U4, docs/design/utf8_set_v1.md 13's U4 row),
# which sits beside this file with NO `rxt_source =` key: the harness's
# LOADED pattern source is THIS FILE's own array of pattern tables
# (DERIVED from gen_patterns.py's table -- `gen_patterns.py --sidecar`
# prints it, `--check` compares it against patterns.rxt/patterns/*.rx
# entry for entry), while patterns.rxt's `ext bench` block is read
# separately, by `pcrecbench.capability`'s SIDECAR/SHIM path
# (`rxt_source.load_aux_rows()`, triggered by the file's mere presence
# beside this sidecar -- no key needed). See bench/utf8/gen_patterns.py's
# own docstring for why this split was chosen over bench/capability's
# later `rxt_source =` switch.

id = "utf8"
version = "0.1"
objective_kind = "feature"
objective = """\
A UTF-8 ENCODING contrast across the twelve UTF-8-capable roster \
configs ([B77], inbox I-90; Frank: "any functionality which might be \
affected by encoding -- classes come to mind"): the twelve \
encoding-dependence axes pcrec's own tests/utf8/axis01-12 test for \
CORRECTNESS, measured here for SPEED, over five generated script \
corpora (Latin-1-Supplement-heavy, Cyrillic, CJK, a mixed corpus with \
emoji, and a byte-clean ASCII control) whose lead-byte histogram is a \
committed, re-derived fact rather than a claim. BUILT ON pcrec's \
`.rxt` format as this set's pattern source of truth, in \
bench/capability's own shape. See docs/design/utf8_set_v1.md and \
bench/utf8/NOTES.md."""
description = """\
Seventy-five patterns (75 members + the floor) across six \
encoding-dependence families -- cls (16, classes and the 1-byte/ \
multi-byte boundary), lit (12, multi-byte literals and the \
required-byte/offset-skip shapes), ci (12, caseless folding over \
non-ASCII), alt-qnt (12, alternation and quantifiers over multi-byte \
units, incl. alt-cyr-64, a 64-branch bridge rung to bench/altwide), \
asr (11, assertions -- \\b/\\B class-scope dependence, lookbehind \
over variable byte widths, true-end anchors), prp (12, \\p/\\P \
general categories, scripts, the Script vs Script_Extensions \
spelling pair, and the prp-ingreek REFUSAL witness, which carries NO \
subject by design) -- plus the floor `~`. Every pattern carries a \
native `.rxt` `provenance` sub-block (source=authored, \
fidelity=synthesized -- a correctness/encoding census, not a \
wild-provenance set) and a `tag family=/hazard=/requires=` \
classification against a six-token subset of pcrecbench.capability's \
closed REQUIRES vocabulary (utf8-encoding, ascii-class-scope, \
unicode-class-scope, lookaround, true-end-anchor, \
unicode-properties). The `ext bench` roster/capability matrix for \
the twelve UTF-8-capable configs is TRANSCRIBED from lane b77u2's own \
witness census (docs/dev/measurements/ \
2026-09-25-b77u2-utf8-witness-census.txt), never re-guessed. See \
docs/dev/lanes/b77u4_report.md for the charter-vs-committed checklist \
and two corrections this lane made on its own evidence (tre-default's \
true-end-anchor withheld here against bench/capability's own stale \
declaration; asr-b-midchar tagged ascii-class-scope per b77u2's \
finding 4)."""

# `search_short` + `throughput` ONLY, per utf8_set_v1.md 10.1: NOT `match`
# -- the lexical whole-subject wrapper is applied per adapter with THREE
# different spellings (pcrec's \z, TRE's ^(?:...)$, rust's \A(?:...)\z),
# exactly the kind of lexical edit whose interaction with an ENCODING
# nobody has checked (bench/capability 3.5's own reason, restated).
regimes = ["search_short", "throughput"]

[subjects]
generator = "gen_subjects.py"
manifest = "manifest.tsv"
throughput_generator = "gen_throughput_subjects.py"
throughput_manifest = "manifest_throughput.tsv"
# utf8_set_v1.md 10.1: matches bench/capability's own precedent.
short_search_max_bytes = 512

[expectations]
file = "expectations.tsv"
default_method = "libpcre2-differential"
# [B77] U1 (docs/design/utf8_set_v1.md 8.1): the SET's own encoding --
# PCRE2_UTF goes in the oracle's option word for EVERY pattern alike (no
# per-subject/per-regime variation); PCRE2_UCP is a per-PATTERN fact,
# carried by the `unicode-class-scope` REQUIRES token (pcrecbench/
# subbench.py's `SET_ENCODINGS`).
encoding = "utf8"

