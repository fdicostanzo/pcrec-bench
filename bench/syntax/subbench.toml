[subjects]
generator = "gen_subjects.py"
manifest = "manifest.tsv"
throughput_generator = "gen_throughput_subjects.py"
throughput_manifest = "manifest_throughput.tsv"
# Every field (2-14 B) and every line (<= 86 B) is inside the band, so the
# two short regimes see the same 42 subjects. 256 is requirements 3's
# "~256-byte subjects" and bench/email's band.
short_search_max_bytes = 256

[expectations]
file = "expectations.tsv"
default_method = "libpcre2-differential"

# Per-testee notes. No testee runs a VARIANT of any pattern: all ninety-one
# are canonical PCRE2 spellings and every adapter runs the canonical text
# (requirements 4.5 -- the record still STATES that, as
# `patterns[].variant = null`). `options` is empty for both engines: the
# patterns carry their own semantics inline (the option settings ARE
# constructs under census) and neither adapter passes a compile option.
[testees.pcre2]
options = {}

[testees.pcrec]
options = {}
# Many patterns use constructs outside pcrec's frozen `std1` set;
# `--features all` is already on every pcrec testee config -- a flag of
# the TESTEE, not a variant of the pattern. A REFUSAL on any pattern is an
# expected, first-class `did-not-compile` outcome of this set (NOTES.md,
# "Give-ups and refusals are results"): on a construct the registry calls
# `unbuilt` it is the census's `unsupported` reading, on one it calls
# `built` it is an OUTLIER by the rule stated there.
