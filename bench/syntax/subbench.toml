# The syntax census SIDECAR (harness contract 2, requirements 5). Fields
# only, no grammar, no directives, no includes -- [DD-13]'s territory is
# deliberately untouched.

id = "syntax"
version = "0.1"
objective_kind = "feature"
objective = """\
A CENSUS across the PCRE syntax an engine may support, one construct per \
pattern in an otherwise plain body, seeded from pcrec's `--list-syntax` \
construct registry so nothing is enumerated from either side's head: what \
each construct COSTS to compile and to run, on the same subjects and the \
same instrument as every other set, so that a testee's outlier on one \
family points at ONE mechanism -- and what a refusal, a compile-time cliff \
or an engine-selection surprise on a construct the registry calls built \
looks like. The census widens the queue of depth probes; it does not \
shorten it (inbox I-42, Frank's charter)."""
description = """\
Ninety-one patterns in eighteen families (90 members + the floor): the \
bare literal `cat` every `cat`-language spelling is read against, anchors \
(`^` `$` `\\A` `\\Z` `\\z` `\\G` and the two under `(?m)`), assertions \
(`\\b` `\\B` `\\K`), classes (eight class escapes, the POSIX bracket, a \
negated set, a three-range set, `.`), quantifiers (greedy, lazy, the four \
possessive suffixes and the `a++ab` / `a+ab` control pair), groups \
(capturing, non-capturing, two named spellings, atomic over a repeat and \
over an alternation, comment, branch-reset, callout), alternation, \
backreferences (`\\1`, `\\2\\1`, `\\g{-1}`, `\\k<name>`, `(?P=name)`), \
lookaround (the four, the non-atomic lookahead, one alpha spelling), a \
conditional, recursion and subroutine calls (`(?R)` `(?1)` `(?&name)` \
`(?(DEFINE)...)` `\\g<1>` `(?P>name)` `(?+1)` `(?-1)`), ten option \
settings, nine single-byte and quoting escapes, `\\R` `\\X` `\\C`, \
`\\p{L}` `\\P{L}` in byte mode, two backtracking verbs, an extended class \
difference, and the floor `#`. Every pattern is typed in gen_patterns.py, \
names the seed rows it exercises, and `coverage.tsv` is derived from the \
table x the seed: every one of the seed's 138 rows is covered, covered by \
its own family column, excused by a stated reason, or a PCRE2 reject. \
Subjects: 30 whole-string FIELDS typed as one construct's hit or semantic \
edge (`item done` / `item done\\n` / `item\\ndone` / `item\\r\\ndone` \
separate the end anchors and the newline escapes; `aaab` and `abc` the \
possessive and atomic edges; `Cat` / `CAT` the option reset; `caf\\xe9` \
the Latin-1 letter), 12 LINES of the same vocabulary for search, and three \
generated texts of the same grammar at 64 KB, 256 KB and 1 MB. See \
NOTES.md for the pattern table, the outlier rule stated before any run, \
the predictions, the room left for a utf family and the cell-time \
estimate."""

# All three. `match` is the whole-string regime the semantic edges are typed
# for; `search_short` reads each construct's per-call cost on twelve lines;
# `throughput` reads its per-byte cost on failing text at three sizes (a
# size sweep, not a density cross: NOTES.md, "Regimes").
regimes = ["match", "search_short", "throughput"]

# THE MEMBERS. The pattern block below is DERIVED from gen_patterns.py's
# table (`--sidecar` prints it; `--check` compares it entry for entry), so
# the ids, files, roles, size classes and tags here cannot drift from the
# patterns. `feature_tier` is `base` on every entry: this set does not
# pre-sort constructs into engine tiers, because which module a construct
# needs is an ENGINE's fact (coverage.tsv carries the seed's own `module`
# column as `seed_module`, labelled as such), and every pcrec testee config
# already passes `--features all`. `hazard_class` is `none` on every entry:
# nothing here is a backtracking hazard by design (NOTES.md). `size_class`
# bands the pattern's bytes as bench/bounded does (tiny < 16 B, small < 256).
# Tags: `fam-<family>` (the eighteen mechanism families), `encoding-bytes`
# (the room for a utf sibling), `seed-row` or `base-grammar`.

[[patterns]]
# base grammar: the three-byte literal. Fourteen patterns spell this language or a superset of it with one construct added (`(cat)`, `(?<w>cat)`, `\x63at`, `(?x) c a t`, `ca(?#comment)t`, `(?n)(ca)t`, `c\Xt`, ...); their cost minus this one's is the construct's
name = "lit-cat"
file = "patterns/lit-cat.rx"
feature_tier = "base"
hazard_class = "none"
size_class = "tiny"
convention = "perl-leftmost-first"
tags = ["fam-literal", "encoding-bytes", "base-grammar"]
role = "member"

