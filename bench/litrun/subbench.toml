# The literal-run sub-bench SIDECAR (harness contract 2, requirements 5).
# Fields only, no grammar, no directives, no includes -- [DD-13]'s territory
# is deliberately untouched, so the unified format absorbs this mechanically
# when it lands.

id = "litrun"
version = "0.1"
objective_kind = "hazard"
objective = """\
What pcrec's [OPT-LITSCAN] S2a (the VM's exact literal run of L >= 2 bytes, \
one bounds check plus one memcmp, replacing a per-byte compare chain) costs \
and saves, on the two shapes pcrec's own lane report (docs/dev/lanes/\
s2a_report.md S7.1, S7.2 at pcrec a32bc86e) asked a bench for: whether a \
factoring pass and a literal-run lowering interact (S7.1's 2x2), and \
whether the compare itself carries a per-call constant or a toolchain-\
specific length cliff, at the literal lengths PCRE2's own gcc-16 lowering \
study names as interesting (S7.2's L-sweep, docs/dev/memcmp_lowering_study.md)."""
description = """\
Fourteen patterns. THE 2x2 SET (S7.1): `alt-foo-tails` (`foo.x|foobar|foo.`, \
cell a -- an alternation whose tails are not all literal, so factoring and \
lit-run can interact), `wild-secrets-aws-access-key-id` (cell a', copied \
verbatim from bench/capability -- an island-shaped alternation where \
factoring is predicted to flip sign under lit-run), `ctrl-abc-dollar` \
(`abc$`, cell b -- no alternation, the factoring-reads-null control) and \
`wild-secrets-github-pat` (cell b', copied verbatim from bench/capability -- \
one 11-byte run behind an exact hybrid window, the factoring-reads-null \
control's wild-provenance twin). THE L-SWEEP (S7.2): `lit-l2` .. `lit-l40`, \
nine EXACT LITERALS of length L = 2, 3, 4, 7, 8, 10, 16, 31, 40 (the first L \
bytes of a 52-character, no-repeated-byte alphabet), each with THREE \
THROUGHPUT-SCALE subjects built DENSE IN CANDIDATE STARTS by tiling a \
per-length unit back-to-back to ~64 KiB (`mat-l<L>`: the literal itself, \
every aligned window a full match; `fbf-l<L>`: the literal's own tail with \
byte 0 replaced, every window fails at the FIRST compared byte; `lbf-l<L>`: \
the literal's own head with the LAST byte replaced, every window fails only \
after L-1 matching bytes) plus ONE short boundary subject (`bnd-l<L>`, \
exactly L-1 bytes: pcrec's P8 guard, `pos + L <= n`, fails on length alone, \
never on content -- inherently a single per-subject event, so it is not \
tiled). Plus the floor (`#`, the ONE byte every fbf/lbf tiled subject also \
contains, so the floor's own per-attempt cost is read against the same \
density the L-sweep measures, not only against a full-length miss). See \
NOTES.md for the pattern table, the regime choice and why, the tiling \
construction's own no-accidental-match proof, the predictions transcribed \
from I-113, and the cell-time estimate."""

# All three. `match`/`search_short` carry the 2x2 set's hit/near-miss
# subjects and the L-sweep's boundary subjects; `throughput` carries ONLY
# the L-sweep's 27 dense tiled subjects (S7.2's own per-attempt-cost
# instrument -- NOTES.md, "Regime choice").
regimes = ["match", "search_short", "throughput"]

# THE MEMBERS. `feature_tier` is `base` throughout: every pattern here is
# {classes, literals, alternation, anchors}, pcrec's frozen `std1` set --
# no testee flag is needed for any member (unlike bench/loglines' `\b`
# pair or bench/altwide's `\b...\b` wrapper).

