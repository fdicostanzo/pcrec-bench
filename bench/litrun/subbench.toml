[subjects]
generator = "gen_subjects.py"
manifest = "manifest.tsv"
throughput_generator = "gen_throughput_subjects.py"
throughput_manifest = "manifest_throughput.tsv"
# Every short subject here is well under 200 B (the widest is the
# github-pat embed-search subject, ~110 B); 200 is headroom, not a wider
# band -- no short subject is excluded from search_short by this cap.
short_search_max_bytes = 200

[expectations]
file = "expectations.tsv"
default_method = "libpcre2-differential"

# Per-testee notes. No testee runs a VARIANT of any pattern in this
# sub-bench: all fourteen are canonical PCRE2 spellings and every adapter
# runs the canonical text (requirements 4.5 -- the record still STATES
# that, as `patterns[].variant = null`). `options` is empty for both
# engines: every pattern carries its own semantics inline (`abc$`'s `$`
# needs no flag; PCRE2's default multiline-off is what the control's own
# testdata provenance assumes) and neither adapter passes a compile
# option. See NOTES.md.
[testees.pcre2]
options = {}

[testees.pcrec]
options = {}
# `feature_tier = "base"` on every member: {classes, literals, alternation,
# anchors} is inside pcrec's frozen `std1` set, so no `--features` flag is
# needed for this set specifically (every pcrec testee already passes
# `--features all` regardless). The two flags this set exists to be read
# against, `-fno-lit-run` and `-fno-altcls-factor`, are TESTEE config
# variables (deny testees, [B108]/lane b108repin), never a pattern
# variant -- the text is byte-identical under either.
