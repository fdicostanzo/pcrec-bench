name = "alt-foo-tails"
file = "patterns/alt-foo-tails.rx"
feature_tier = "base"
hazard_class = "wide-alternation"
size_class = "tiny"
convention = "perl-leftmost-first"
tags = ["litrun", "2x2", "cell-a", "alt-tails", "tier-base"]
role = "member"

