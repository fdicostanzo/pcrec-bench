# bench/unusual's SIDECAR (harness contract 2), GENERATED by gen_patterns.py from
# members.py -- edit the generator, never this file (`gen_patterns.py --check`).
# Design: docs/design/unusual_set_v1.md v0.2 (lane b148l3 = L3 of its build order).
#
# REGIMES. `search_short`, `throughput` and (lane b148l4, L4) `call-stream`: the
# F1 segment streams are `[subjects] stream_manifest` (manifest_streams.tsv +
# streams/ + calls/, gen_streams.py), judged against `[expectations]
# stream_file` (expectations_stream.tsv) by the harness; a pattern with no
# stream expectation has no call-stream cell (Subbench.applies).
#
# APPLICABILITY. applies.tsv (`[subjects] applies`) says which (pattern, subject)
# cells a LARGE subject belongs to (a 5 MB comment is cscan's subject, not the
# JSON validator's); expectations.tsv covers the full cross product on the short
# subjects and the applicable cells only on the throughput subjects. The harness
# honours it (Subbench.applies, L4).
#
# `unusual_set = true` (L4): this set accepts the `unusual_only` testees (the
# `deep` arms, docs/design/unusual_set_v1.md 6.2) and asks every adapter for its
# READ-BACK of the engine's effective limits on the compile row (both arms).
#
# CAPABILITY. patterns.rxt carries the `ext bench` matrix; the `requires-*` tags
# below are read against it (fail-closed). The vars / unusual-<member> tokens are
# L1's REQUIRES_VOCAB family (b148land switched the interim `needs-*` spelling).

id = "unusual"
version = "0.1"
objective_kind = "feature"
objective = """\
Realistic patterns whose feature is outside the common regex subset -- \
recursion, callouts, caller variables: the answer, the capability verdict \
(native / assisted / not-capable), and the cost of the feature, assist \
included."""
description = """\
22 patterns in three feature families plus the floor. RECURSION: \
pcrec's `cscan` (the C `(?{ ... })` end scanner, one pcrec pattern, MIT) with \
its declared Oniguruma syntax-only variant, and two WILD members -- \
pcre2pattern(3)'s balanced-parenthesis pattern (BSD-3) and a `(?(DEFINE)` \
JSON validator (Stack Overflow 3845829, CC BY-SA 4.0) with its Onig variant. \
CALLOUTS: Luhn, ISBN-13 and set membership as twin / pass / real arms, and \
netstrings as pcrec-consume / assisted / twin. VARS: three `${...}` members \
and one spelling twin. Short subjects \
are typed cases for every member; the throughput subjects are the F3 \
pathologicals (a depth ladder to 100k, a 5 MB comment, splice and identifier \
floods) and one large text per other family; the F1 segment streams \
(call-stream) are declared in manifest_streams.tsv, incl. the F2 SQLite \
function-body streams. The F2 kernel bodies are SKIPPED BY NAME in 0.1 \
(skipped_subjects.tsv): the fetches are not approved. See NOTES.md."""

regimes = ["search_short", "throughput", "call-stream"]
unusual_set = true

[subjects]
generator = "gen_subjects.py"
manifest = "manifest.tsv"
throughput_generator = "gen_throughput_subjects.py"
throughput_manifest = "manifest_throughput.tsv"
stream_generator = "gen_streams.py"
stream_manifest = "manifest_streams.tsv"
applies = "applies.tsv"
short_search_max_bytes = 1024

[expectations]
file = "expectations.tsv"
stream_file = "expectations_stream.tsv"
default_method = "libpcre2-differential"

[[patterns]]
name = "cscan"
file = "patterns/cscan.rx"
feature_tier = "base"
hazard_class = "none"
size_class = "small"
convention = "perl-leftmost-first"
tags = ["family-recursion", "hazard-none", "provenance-pcrec-scandog", "fidelity-verbatim", "requires-recursion", "requires-named-groups", "requires-conditionals", "requires-atomic-group", "requires-lookaround"]
role = "member"

