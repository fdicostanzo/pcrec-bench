# The SENTINEL set's SIDECAR (harness contract 2, requirements 5). Fields
# only, no grammar -- [DD-13]'s territory is untouched. Every pattern block
# below is DERIVED from bench/capability/subbench.toml by gen_patterns.py
# (--check compares them); nothing is authored here.

id = "sentinel"
version = "0.1"
objective_kind = "hazard"
objective = """\
An INSTRUMENT sentinel, not a survey: a small, FIXED set of short-call cells \
whose per-call time (tens of ns) is sensitive to the bench's OWN timing \
code, measured in EVERY window beside pcre2-jit as the flat control. [B133] \
(after [B132]): adding stamp getters to testees/pcrec/driver.c moved short \
calls +10-17% on program-identical cells, which looked like a pcrec \
regression for three weeks (O-92). If the sentinel shifts while pcre2-jit \
stays flat, the INSTRUMENT moved; if a pcrec cross-pin Delta on these cells \
is not echoed by the sentinel's own shift, it is the engine's."""
description = """\
Fourteen capability@0.2 members plus capability's floor, copied byte for byte \
(gen_patterns.py): eleven short-call MOVERS of [B132]'s tables (winpath-\
near-miss +25%, trim-nested-star, numeric-id, phone-list, us-zip, base10num, \
ipv4, uuid, semdiv, router-prefix-order, validator-email) and three CONTROLS \
that stayed flat in every [B132] arm (waf-942360, keyword-prefix-order, \
file-ext-order). The 75 short subjects are \
capability@0.2's own (gen_subjects.py regenerates them through capability's \
builder: same bytes, same manifest). search_short ONLY: the sentinel reads \
the per-call cost of a failing/short search, nothing else. See NOTES.md for \
how a window report must read it."""

regimes = ["search_short"]

[[patterns]]
name = "winpath-near-miss"
file = "patterns/winpath-near-miss.rx"
feature_tier = "base"
hazard_class = "none"
size_class = "small"
convention = "perl-leftmost-first"
tags = ["sentinel", "family-wild-logparse", "hazard-none", "provenance-authored", "fidelity-synthesized"]
role = "member"

