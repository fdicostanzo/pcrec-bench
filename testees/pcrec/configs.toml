# testees/pcrec/configs.toml -- the pcrec testees.
#
# requirements 4.2: pcrec is the special case in the ROSTER, not in the
# schema. Its variations -- `--engine=`, captures on/off, later SIMD and
# whatever [ENG-*] adds -- are separate roster entries, each with its pcrec
# COMMIT PINNED. Nothing about that mechanism is pcrec's; it is the same
# (engine, version, configuration) triple every testee is.
#
# `pin` is read from HERE and never hard-coded in the adapter. pin.sh
# materialises it with `git archive` into the build root and builds it there;
# it NEVER writes inside pcrec's own tree.
#
# WHY `--features all` IS ON EVERY CONFIG. pcrec's default feature set is
# `std1`, which excludes the named-groups and recursion modules, so
# bench/email's `factored.rx` is refused with "requires module
# 'named-groups'" (MEASURED 2026-08-25 against pin 8da6120, re-verified at
# 692c2e8, at 35e1ab1, at 36d5963, at 96e44c2, at 263b013, at a7e0bdf, at
# 1989c62 and RE-VERIFIED at 334fd10e, 2026-09-05: same refusal, same
# wording -- "(?<...) requires module 'named-groups' (pattern offset 3)"). That is a
# BUILD/RUN flag of the testee -- the pattern text handed to pcrec is
# byte-identical either way -- not a pattern variant. bench/email/NOTES.md
# says so where a reader of the numbers will find it. Since a7e0bdf
# ([M4-QUOTING]) std1 also excludes the new `quoting` module (`\Q...\E`;
# "\Q requires module 'quoting'", MEASURED) -- `--features all` includes
# it, but no bench pattern uses \Q, so nothing measured changes until a set
# charters it (RE-VERIFIED at 334fd10e: same wording, "\Q requires module
# 'quoting' (pattern offset 0)").

# ---------------------------------------------------------------------------
# THE COMPILEE TOOLCHAIN AXIS -- `cc` ([B24]; pcrec [CC-CLANG], its
# docs/testing.md "CLANGGEN").
#
# pcrec is an AHEAD-OF-TIME compiler: it emits C and stops. Whoever invokes a
# C compiler on that C is the COMPILEE TOOLCHAIN, and on this bench that is
# US -- the adapter's phase-2 command line (`_compile_one`). pcrec therefore
# has no `--cc` flag to pass through and never will; the axis is a property
# of the TESTEE, exactly like `--engine=vm` or `--no-captures`, so it is
# spelled here.
#
#   cc = "gcc" | "clang"      OPTIONAL, per config.
#
# ABSENT means "whatever `$CC` says, else gcc" -- today's behaviour, byte for
# byte: no `cc` clause in `build_flags`, no `config_extra`, the same derived
# `testee_id` as before this key existed. PRESENT is an IDENTITY CLAIM: the
# artifact AND the shim (they are one translation unit -- shim.c #includes
# artifact.c) are compiled by that compiler, `config_extra = "cc-<name>"`
# joins the derived `testee_id` (record_schema.md 6.4's escape hatch for two
# testees differing only in build flags), and `build_flags` names the
# compiler and its `--version` first line.
#
# PRECEDENCE, and why it is not pcrec's. In pcrec's `CLANGGEN=1` an explicit
# `CC=` on the command line always wins, because there `CLANGGEN` is a
# DEFAULT. Here `cc` is part of the testee's identity: a `pcrec-vm-clang`
# record built by gcc would carry a testee_id that lies, and a record whose
# id lies is worse than no record. So:
#
#   * a config with NO `cc`   -> `$CC` if set, else gcc  (unchanged)
#   * a config WITH `cc`      -> that compiler
#   * both, and they DISAGREE -> a clean AdapterError naming both, before
#                                anything is measured. Unset `$CC` (or set it
#                                to match) and run again.
#
# THE DRIVER DOES NOT MOVE. `driver.c` is built by `build_driver()` from
# `$CC` on every config, so a `-clang` testee differs from its gcc sibling in
# exactly ONE variable: the compiler that built the artifact under
# measurement. The record says so twice -- `run.driver_compiler` (the
# driver's) beside `testee.build_flags` (the artifact's).
#
# `environment.compiler` remains the BOX's toolchain dimension (the schema's
# 6.7, and its 11.4 note "one `compiler` field ... is the box's C compiler
# still an environment dimension"): on a `-clang` testee it still reads gcc,
# and the artifact's compiler is read off `testee.build_flags` /
# `testee_id`. Flagged for the schema panel, not worked around here.
pin = "334fd10e"

[testees.pcrec-auto]
engine_mode = "auto"
captures = "on"
flags = ["--features", "all"]
description = "pcrec defaults: engine selected automatically, captures on"

[testees.pcrec-nocaps]
engine_mode = "auto"
captures = "off"
flags = ["--features", "all", "--no-captures"]
description = "pcrec --no-captures: the generation axis that recovers a pure-DFA artifact for a group-bearing pattern"

[testees.pcrec-vm]
engine_mode = "vm"
captures = "on"
flags = ["--features", "all", "--engine=vm"]
description = "pcrec --engine=vm: the VM forced, which also disables the DFA prefilter so the VM derives the whole span independently"

# ---------------------------------------------------------------------------
# THE CLANG SIBLINGS ([B24]). Each is its gcc sibling above with ONE key
# added -- same pin, same pcrec flags, same engine mode, same captures -- so
# a pair of records differs in the compilee toolchain and nothing else. The
# `-in` variants stay gcc-only on purpose: the frame-buffer axis and the
# compiler axis crossed would give four cells whose differences no single
# comparison can attribute (BD3's one-variable rule applied to the roster).
#
# NOT EVERY ARTIFACT COMPILES UNDER CLANG AT EVERY PIN, and that is a
# first-class outcome, not a harness failure. MEASURED at a7e0bdf (abi 13,
# 2026-09-01, clang 21.1.8): a VM artifact that never pushes a resume frame
# emits `goto *run->resume_stack[...].resume_label;` while the function
# contains no `&&label` expression, and clang refuses it --
#
#     error: indirect goto in function with no address-of-label expressions
#
# -- a `did-not-compile` row with clang's own diagnostic, which is exactly
# what the bench is for. pcrec's [CC-CLANG] step 1 fixed it on their side at
# abi 14 (`src/gen/emit_vm.c`'s `has_push`); the day this bench's pin crosses
# that, the refusals stop appearing and the rows become numbers.
[testees.pcrec-auto-clang]
engine_mode = "auto"
captures = "on"
cc = "clang"
flags = ["--features", "all"]
description = "pcrec defaults, artifact compiled by CLANG: the compilee-toolchain axis ([B24]) against pcrec-auto -- same pin, same flags, one variable moved"

[testees.pcrec-nocaps-clang]
engine_mode = "auto"
captures = "off"
cc = "clang"
flags = ["--features", "all", "--no-captures"]
description = "pcrec --no-captures, artifact compiled by CLANG: the compilee-toolchain axis ([B24]) against pcrec-nocaps"

[testees.pcrec-vm-clang]
engine_mode = "vm"
captures = "on"
cc = "clang"
flags = ["--features", "all", "--engine=vm"]
description = "pcrec --engine=vm, artifact compiled by CLANG: the compilee-toolchain axis ([B24]) against pcrec-vm -- the VM artifacts are where the two compilers have the most room to differ, and at abi 13 where some of them refuse outright"

# ---------------------------------------------------------------------------
# THE CALLER-PROVIDED FRAME BUFFER TESTEES (pcrec match_api.md 10, [DD-14.FB]).
#
# `buffer_frames` / `buffer_trail` are CAPACITIES -- resume frames and trail
# entries, NEVER bytes (10.2); the driver sizes the regions per artifact from
# the frame sizes the artifact stamps, and passes no descriptor at all on an
# artifact that stamps 0 (every DFA artifact, 10.4). The number a `-in` cell
# measures is the cost of the depth path with an adequate buffer; the two
# capacities are the knob and they are recorded (testee.runtime_options, and
# the buffer_frames / buffer_trail metadata pairs on every compile row whose
# artifact actually used them).
#
# WHY 32768 / 131072 -- MEASURED 2026-08-25 at pin 692c2e8, on the VM
# artifact of bench/email's `factored` pattern (`(?:...)\z` form, match
# regime, `--trials 1 --iters 1`), the only artifact on this sub-bench where
# the frame budget binds. The five subjects that give up with
# PCREC_ERR_FRAMES at the stamped default (2048 frames / 3072 trail) need,
# each with the OTHER capacity held far above binding:
#
#     subject  bytes  frames  trail        (trail/frames ~ 4.5, pcrec's ratio)
#     s-058    4011    4005   20020        2000-deep dotted local part
#     s-059    5134   10245   46100        5 KB quoted string
#     s-061    2008    1504    5020        500-label domain
#     s-063    5135    5122   23044        5 KB quoted string, unescaped quote
#     s-064    4110    2053   18452        alternating escapes, 4 KB
#
# The smallest power-of-two pair at which every give-up vanishes is
# 16384 / 65536 (16384 / 32768 still loses s-059 on the trail). The config
# sits one doubling above that: 32768 x 24 B + 131072 x 16 B = 2.75 MiB per
# run, touched once outside every timed loop. See testees/pcrec/CLAUDE.md.
#
# The table above is HISTORY (pin 692c2e8) and is not re-derived at every
# re-pin: it is a capacity search, not a timing. What IS re-proved at the
# CURRENT pin, on every `make check-harness`, is the conclusion the numbers
# were chosen for -- selfcheck's `buffer-matters` arm shows, at 36d5963
# (2026-08-29; at 35e1ab1 before it), the stamped default giving up
# PCREC_ERR_FRAMES on s-059, a tiny 4/4 caller buffer giving up BY NAME, and
# THESE capacities matching the whole subject. [OPT-1]'s tiered default
# entry (abi 5) did not move them: it escalates to the same stamped default,
# so the give-up boundary is where it was (pcrec I-8's counter measured the
# escalations, not new give-ups). Neither did abi 9-11 ([B18]): the
# `factored` VM artifact still stamps RX_RESUME_FRAMES 2048 / RX_TRAIL_FRAMES
# 3072 / frame sizes 24 / 16, and [ART-SIZE]'s capacity floor (limits.md 8a)
# forbids the size term from lowering a declared capacity below the default
# K's -- on this sub-bench no K moved at all (every VM artifact K=8/default).

[testees.pcrec-auto-in]
engine_mode = "auto-in"
captures = "on"
flags = ["--features", "all"]
buffer_frames = 32768
buffer_trail = 131072
description = "pcrec defaults with a caller-provided frame buffer (the _in entries, match_api.md 10): engine selected automatically, captures on, 32768 resume frames / 131072 trail entries. INERT on a DFA artifact, which takes no buffers"

# RULED (manager, 2026-08-25, with the pcrec manager's concurrence): at
# 692c2e8 both email patterns select the DFA under `auto`, so `pcrec-auto-in`
# builds no artifact that reads its buffer on bench/email -- it is DEFINED
# (the checks use it to prove the DFA-artifact NULL path, and it becomes live
# on a sub-bench with VM-selected patterns under `auto`, e.g. lookaround +
# backreference) but it is NOT MEASURED on bench/email: an entry that measures
# the same artifact as `pcrec-auto` is a trap for a reader of the report.
# `pcrec-vm-in` is the roster entry that runs here: the entry on which the
# capacities above were measured and the only one where the depth path is
# reachable.
[testees.pcrec-vm-in]
engine_mode = "vm-in"
captures = "on"
flags = ["--features", "all", "--engine=vm"]
buffer_frames = 32768
buffer_trail = 131072
description = "pcrec --engine=vm with a caller-provided frame buffer (the _in entries, match_api.md 10): the VM forced, 32768 resume frames / 131072 trail entries, sized so bench/email's five deep subjects complete instead of giving up PCREC_ERR_FRAMES"

# ---------------------------------------------------------------------------
# THE LOCAL TESTEE (Frank's I-4 (c), [B10]): a PROVIDED binary, no pin.sh.
#
#   PCREC_BIN=/path/to/pcrec [PCREC_LOCAL_FLAGS="--engine=vm ..."] \
#       python3 -m pcrecbench quick --testee pcrec-local --vs pcre2-jit ...
#
# `binary` names the environment variable that must hold the path (REQUIRED
# at run time; a missing or non-executable path is a clean AdapterError
# naming the variable). `flags` is the base set; whatever $PCREC_LOCAL_FLAGS
# adds (split on whitespace) is appended, and BOTH land in build_flags /
# runtime_options. `engine_mode` and `captures` below are the DEFAULTS the
# adapter overrides from the effective flags -- `--engine=vm` makes the mode
# `vm`, `--no-captures` makes captures `off` -- so the derived testee_id is
# honest about what ran.
#
# SCRATCH-TIER BY CONSTRUCTION: describe() reports `tier: scratch`,
# engine_version is `local:<sha256 prefix>[+<git describe --dirty>]`, and the
# store refuses the record into the canonical tree. Everything else --
# emit-c / gcc / load, the shim, the driver, the metadata, the _in buffers --
# is the same code path as the pinned testees (no forked compile path).
[testees.pcrec-local]
local = true
binary = "PCREC_BIN"
extra_flags = "PCREC_LOCAL_FLAGS"
engine_mode = "auto"
captures = "on"
flags = ["--features", "all"]
description = "a PROVIDED pcrec binary ($PCREC_BIN, + $PCREC_LOCAL_FLAGS): the edit-test loop's testee, scratch tier by construction, never pinned, never ranked"

# ---------------------------------------------------------------------------
# THE EMITTED-SIZE CAP AXIS -- `max_emit_bytes` / `max_emit_code_bytes`
# ([B31]; pcrec [ART-SIZE], docs/spec/limits.md 8, inbox I-32 (vii)).
#
# pcrec refuses rather than emit past either of two caps -- 1,000,000
# comment-excluded bytes TOTAL and 500,000 of them OUTSIDE table
# initializers (CODE) -- and both are RAISE-ONLY per compile:
# `--max-emit-bytes=N` / `--max-emit-code-bytes=N` let a caller accept a
# larger artifact and can never manufacture a refusal that would not have
# happened anyway (limits.md 8: "no caller can manufacture someone else's
# refusal"). The archived defaults are `list_limits.tsv`'s
# PCREC_MAX_EMIT_BYTES / PCREC_MAX_VM_EMIT_CODE_BYTES rows, and the adapter
# reads its raise-only FLOOR from that file rather than keeping a second
# copy of a pcrec constant.
#
#   max_emit_bytes = N          OPTIONAL, per config, BYTES
#   max_emit_code_bytes = N     OPTIONAL, per config, BYTES
#
# ABSENT means today's behaviour byte for byte: no flag on pcrec's argv, no
# clause in `build_flags`, no `config_extra`, the same derived `testee_id`
# (frozen-renderer proof, `check_cap_axis` arm 1, against a COMMITTED
# production record). PRESENT is an IDENTITY CLAIM -- the flag rides in
# `flags`, so one list feeds the argv, `build_flags` and
# `runtime_options` alike, and `config_extra` puts the VALUES in the
# derived testee_id. A value BELOW the archived default is a clean
# AdapterError naming both numbers before anything is measured.
#
# WHY IT IS AN AXIS AND NOT A GATE REMOVED. Raising `--max-emit-bytes` also
# raises the [ART-SIZE] size-term ladder's own scratch abort bound (pcrec
# src/core/compile.c: `3 * cap`, saturating), so a raised-cap compile may
# explore -- and select -- an unroll K the default-cap compile aborted out
# of. Two artifacts built under different caps are TWO ARTIFACTS. That is
# why the plain configs stay, why their default-cap refusals remain
# first-class `did-not-compile` rows, and why the raised value is in the
# testee_id rather than hidden in a flag.
#
# WHY 8,388,608 FOR BOTH -- MEASURED 2026-09-02 at pin 1989c62 over the
# WHOLE of bench/altwide@0.1: 20 patterns x both forms x {auto, vm} = 80
# compiles under a 100,000,000 B probe raise, every one of which COMPILED
# (no timeouts, nothing saturated), archived verbatim in
# docs/dev/measurements/2026-09-02-altwide-raised-cap-sizes.txt. The
# largest emitted artifact on either cap's quantity is `s-4096`'s
# whole-subject VM form at 3,741,164 bytes (a forced-VM artifact carries no
# table initializers, so its TOTAL and its CODE bytes are the same number
# and one maximum settles both caps). The bound is the smallest power of
# two at or above twice that: 2 x 3,741,164 = 7,482,328 -> 8,388,608 (8
# MiB). Per mode the maxima are auto 2,586,958 total / 37,621 code
# (`w-2048` and `s-4096`, both whole-subject) and vm 3,741,164 / 3,741,164;
# the auto route's own code maximum is BELOW pcrec's 500,000 default, so a
# per-mode code bound would have been an illegal LOWERING -- both configs
# therefore carry the same pair, which also keeps `pcrec-auto-bigcap` and
# `pcrec-vm-bigcap` one variable apart from each other exactly as
# `pcrec-auto` and `pcrec-vm` are.
#
# WHAT THE RAISE BUYS, measured in the same census: at the DEFAULT caps 50
# of those 80 compiles REFUSE (26 auto rows at the total cap, 24 vm rows at
# the code cap) -- 14 of 20 patterns lose at least one auto form and 12 of
# 20 at least one vm form. The refusals are not free, either: an auto-route
# refusal is checked AFTER emission and costs 0.07-40.2 s, while a vm-route
# refusal costs 0.01-0.07 s.
#
# NO `-bigcap-clang` CONFIG. BD3's one-variable rule: the cap axis crossed
# with the compilee toolchain would give four cells no single comparison
# can attribute. The COMPOSITION is nonetheless defined and checked (the
# adapter's `compose_config_extra`: the axes in chartering order, `cc`
# then the caps, joined by `-`, so a slug only ever grows by appending),
# because `pcrec-local` can reach it through `$PCREC_LOCAL_FLAGS` and `$CC`
# and a composition nobody has exercised is a composition that is wrong.
[testees.pcrec-auto-bigcap]
engine_mode = "auto"
captures = "on"
max_emit_bytes = 8388608
max_emit_code_bytes = 8388608
flags = ["--features", "all"]
description = "pcrec defaults with BOTH emitted-size caps raised to 8 MiB ([B31], limits.md 8, raise-only): the configuration under which bench/altwide's wide rungs emit an artifact at all, against pcrec-auto -- same pin, same engine mode, same captures, the caps the one variable moved"

[testees.pcrec-vm-bigcap]
engine_mode = "vm"
captures = "on"
max_emit_bytes = 8388608
max_emit_code_bytes = 8388608
flags = ["--features", "all", "--engine=vm"]
description = "pcrec --engine=vm with BOTH emitted-size caps raised to 8 MiB ([B31]): the VM forced on the wide rungs it refuses at the 500,000 B CODE cap by default, against pcrec-vm -- one variable moved"

# ---------------------------------------------------------------------------
# THE SCAN-EDGE DENY AXIS -- `-fno-scan-edge` ([B32]; pcrec [OPT-5] STEP 1
# and the [OPT-EDGE] charter, docs/spec/tuning.md 2.18, --list-axes bit 21,
# inbox I-33).
#
# WHAT THE FULL SUITE FOUND. At pin 1989c62 the 29-cell suite turned up ONE
# regression family, and it has an exact stamp: every bench/loglines pattern
# whose artifact stamps a non-`none` RX_DFA_SCAN_EDGE is SLOWER than its
# pre-[OPT-5] self -- `iso-ts` x1.06 (search) / x1.09 (throughput),
# `http-5xx` and `ipv6` x1.03-1.09 -- and every pattern that stamps `none`
# is flat. pcrec's I-33 gives the mechanism: the emitted scan edge is ONE
# COMPARE PER EDGE PER SCAN-LOOP ITERATION, so it is the edge COUNT, not
# the edge's presence, that predicts the cost. `iso-ts` emits 8 edge blocks
# into rx_search and 4 into rx_match; `http-5xx` and `ipv6` one apiece
# (MEASURED 2026-09-02 at this pin; the count is on every compile row as
# the `scan_edges` / `scan_edges_match` metadata pair).
#
# WHY A TESTEE AND NOT A FLAG ON AN EXISTING ONE. pcrec chartered [OPT-EDGE]
# to make the edge pay for itself, and that work needs a BEFORE. Denying
# the axis at the SAME COMMIT is the honest before: `-fno-scan-edge`
# restores the pre-[OPT-5] machine (the counted run's interior states go
# back into the transition table) with the same abi, the same shim, the
# same emitted-text fixes -- where re-pinning to a7e0bdf's predecessor
# would move a dozen other things at once. It is the ONE deny flag on any
# DFA axis whose denial changes the MACHINE rather than only emitted text,
# which is exactly why it can stand in for a pin.
#
# ONE VARIABLE (BD3). `pcrec-auto-noedge` is `pcrec-auto` plus the flag:
# same pin, same `--features all`, same engine mode, same captures, gcc
# like its sibling. The pair is the [OPT-EDGE] BEFORE/AFTER on
# bench/loglines, and bounded@0.3's P1 wants the same arm.
#
# NO CONFIG KEY OF ITS OWN. The flag rides in `flags`, the one list that
# feeds pcrec's argv, `build_flags` and `runtime_options` alike; the
# adapter DERIVES the axis from the effective flags (`effective_denies`),
# so `$PCREC_LOCAL_FLAGS="-fno-scan-edge"` reaches the derived testee_id
# down the same code path. `config_extra` gains `noedge` LAST, after `cc`
# and after the caps: `compose_config_extra` orders the parts by the order
# the axes were chartered, so a slug only ever grows by appending and an id
# already in `store/` never has a part inserted ahead of the one a reader
# knows it by.
[testees.pcrec-auto-noedge]
engine_mode = "auto"
captures = "on"
flags = ["--features", "all", "-fno-scan-edge"]
description = "pcrec defaults with the [OPT-5] SCAN EDGE DENIED (-fno-scan-edge, --list-axes bit 21): the pre-[OPT-5] machine built at the SAME pin, so the pair against pcrec-auto is [OPT-EDGE]'s BEFORE/AFTER with the transform as the one variable ([B32], pcrec I-33)"

# ---------------------------------------------------------------------------
# THE COMPILEE-FLAGS AXIS -- `cflags` ([B35]; pcrec inbox I-39 (v), the
# layout probe for the disputed `floor` / match / `auto` cell).
#
# pcrec is an AHEAD-OF-TIME compiler; it emits C and stops. Whoever runs a
# C compiler on that emitted C decides how the FUNCTION LANDS in memory --
# alignment, layout -- and that is US, exactly as `cc` ([B24]) says WHICH
# compiler runs. `cflags` says what EXTRA FLAGS that compiler gets, for our
# own phase-2 compile only (`$CC -O2 -fPIC -shared <cflags> shim.c`, which
# `#include`s the artifact -- so the artifact and the shim are compiled by
# the same command, with the same extra flags, and can never drift apart).
#
# WHY -- I-39 (v): gcc read 503.3 ns on THIS bench and 307 ns in pcrec's own
# hand harness, on BYTE-IDENTICAL artifacts; clang matched to within 1.4 %.
# A 48-instruction loop straddling a 64-byte cache line can cost exactly
# that ratio depending on where the compiler lands it, and
# `-falign-functions=64` pins the landing so the disputed cell's before/
# after can be read without re-pinning pcrec or changing what it emits.
#
#   cflags = ["-falign-functions=64", ...]   OPTIONAL, per config, a LIST
#
# THESE ARE NEVER PASSED TO PCREC. pcrec's own `flags` (its argv --
# `--features all`, `--engine=`, the [B31] cap raises, the [B32] denials)
# is a wholly different list; a config may carry both axes independently,
# and `_compile_one`'s phase 1 (`pcrec -p rx ...`) never sees `cflags` at
# all. THE DRIVER DOES NOT MOVE: `build_driver()` still builds `driver.c`
# from `$CC` with no extra flags on every config, so a `cflags` testee
# differs from its plain sibling in exactly ONE variable -- the artifact+
# shim compile -- the same one-variable shape `cc` already has for the
# compiler choice itself.
#
# ABSENT means today's behaviour byte for byte: no extra token on the REAL
# argv, no clause in `build_flags`, no `config_extra`, the same derived
# `testee_id` (frozen-renderer proof, `check_cflags_axis` arm 1, against a
# COMMITTED production record). PRESENT is an IDENTITY CLAIM: the flags
# join `build_flags` NAMED (adapter.py's `cflags_note`, not silently folded
# into the fixed "-O2 -fPIC -shared" text) and a deterministic slug token
# (`cflags_token`: strip leading dashes and a leading bare `f` immediately
# followed by a letter -- GCC/clang's `-f<name>` family, the same one the
# [B32] deny words already strip -- replace non-`[a-z0-9]` runs with `-`,
# prefix `cf-`) joins `config_extra` LAST -- after `cc`, the [B31] caps and
# the [B32] denials, `compose_config_extra`'s own chartering-order rule --
# so a `cflags` testee can never collide in the store with its plain
# sibling. `-falign-functions=64` -> `cf-align-functions-64`.
#
# `pcrec-local` derives this axis from its OWN `configs.toml` entry only,
# never from an environment variable: `$PCREC_LOCAL_FLAGS` is pcrec's own
# argv (what `engine_mode`/`captures`/the caps/the denials all read from),
# not the compilee toolchain's, so there is no local equivalent to widen.
[testees.pcrec-auto-align64]
engine_mode = "auto"
captures = "on"
cflags = ["-falign-functions=64"]
flags = ["--features", "all"]
description = "pcrec defaults with the artifact+shim compiled under -falign-functions=64 ([B35], pcrec I-39 (v)'s layout probe for the disputed floor/match/auto cell): against pcrec-auto -- one variable moved, the COMPILEE's own function alignment, never pcrec's emitted C"

# ---------------------------------------------------------------------------
# THE ALTERNATION-ISLAND DENY AXIS -- `-fno-alt-island` ([B37]; pcrec
# [ENG-ISL] STEP 1, docs/spec/tuning.md 2.20, --list-axes `alt-island`
# bit 23, inbox I-43/I-44; pin 334fd10e = abi 22).
#
# WHAT THE ISLAND IS. A flat alternation whose whole subtree matches a
# FINITE set of literal byte strings is lowered by the VM as a TRIE over
# those strings' bytes -- a byte compare at a one-child node, a `switch`
# at a many-child node, one try site per node where an alternative ends
# -- instead of `vm_alt`'s CHAIN of one resume frame per untried branch
# (matching the last of 512 branches cost 511 push/fail/pop round trips
# on ONE subject byte). `RX_VM_ALT_ISLANDS` counts the islands an artifact
# took; the island DECLINES class-leading alternations (a caseless one is
# class-leading by D23), prefix-bearing ones under four words, and any
# island over 2x the chain's estimated size or over the cap -- each a
# selection outcome, never a refusal.
#
# WHY A TESTEE. [B37] absorbs SIX abi steps in ONE pin, so "one change per
# pin per night" cannot hold for the pin itself; the AFTER is split by
# DENY FLAG within it (Frank, I-47). `pcrec-auto-noisland` is
# `pcrec-auto` plus this flag -- same pin, same `--features all`, same
# engine mode, same captures, gcc like its sibling -- so the pair
# ISOLATES the island's effect on bench/altwide: the ORDER pair
# `w-256`/`srt-256` (the x8.87/x20.1 branch-order effect I-43 says is
# gone at the source: MEASURED at this pin the two VM artifacts are
# byte-identical in emit_bytes, 292,043 each, where 288d505 emitted
# 341,201 vs 302,047), the VM refusal wall (moved from 256<w<=384 to
# 384<w<=512: `w-384`'s forced-VM form compiles at 427,824 B where the
# chain refused at 508,607 -- and STILL refuses under this flag, at
# 508,715), and the island/chain code-byte ratios (w-256 0.856, pfx3-256
# 0.812, s-256 0.764 -- I-43's three numbers reproduced).
#
# ONE VARIABLE (BD3), and the same shape as `pcrec-auto-noedge`: the flag
# rides in `flags`, the ONE list that feeds pcrec's argv, `build_flags`
# and `runtime_options`; the adapter DERIVES the axis (`effective_denies`,
# DENY_FLAGS), and `config_extra` gains `noisland` in chartering order --
# after `cc`, the caps, `noedge` and `nopin` -- so an id already in
# `store/` never has a part inserted ahead of the one a reader knows it
# by. `$PCREC_LOCAL_FLAGS="-fno-alt-island"` reaches the derived testee_id
# down the same code path.
#
# WHAT THE DENIAL MEASURABLY CHANGES besides the island: at this pin a
# denied `foo|bar` goes islands 1 -> 0, `RX_VM_FRAMELESS` 1 -> 0 (the
# chain PUSHES) and `RX_VM_ENTRY_SHAPE` forward -> plain (a framed
# artifact is `plain` by construction, tuning.md 2.21) -- so a noisland
# row differs from its sibling in the program, the frame discipline and
# the entry chain together, which is what the pre-[ENG-ISL] machine WAS.
# The pair is answer-identical modulo which budget binds (I-43: a
# budget-bound cell may differ in the island's favour only).
[testees.pcrec-auto-noisland]
engine_mode = "auto"
captures = "on"
flags = ["--features", "all", "-fno-alt-island"]
description = "pcrec defaults with the [ENG-ISL] ALTERNATION ISLAND DENIED (-fno-alt-island, --list-axes bit 23): vm_alt's serial resume chain built at the SAME pin, so the pair against pcrec-auto is the island's BEFORE/AFTER on bench/altwide with the lowering as the one variable ([B37], pcrec I-43)"
