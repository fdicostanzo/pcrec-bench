]
predicate     = """
A cross-pin Δ whose two pins are not adjacent in `[[pin_order]]`. The Δ
partner is the reporter's own: the same (engine, config) sibling
present in this report with the latest record timestamp strictly older
than this row's.
"""
threshold     = "adjacency in `[[pin_order]]`, catalogue DATA"
threshold_src = """
The partner is `_cross_pin_info`'s own choice (report.py: same engine
and config, a different version slug, the newest record timestamp
strictly older than this testee's). Adjacency is read from this
catalogue's `[[pin_order]]` table, never inferred: `store/index.tsv`
has no pin-order column and ordering by earliest timestamp gives
STORE-adjacency, a different predicate (panel B10). A pin absent from
the table is exit 2.
"""
