[[rule]]
id            = "R-BUCKET-FORM"
title         = "the regime artifact"
class         = "bucket"
since         = "1.0"
grain         = ["set"]
aggregate     = []
inputs        = [
  "report:rank?metric=median_ns.{pattern,regime_or_na,form,fact,testee}",
]
predicate     = """
A ranking group whose RANKABLE rows carry both `same program` and
`separate artifact` in the `fact` column. Rankable deliberately: the
`fact` column is emitted on excluded, not-ranked, scratch and
did-not-compile rows alike, and a group whose only `separate artifact`
row was excluded is not a group where two forms rank together.
"""
threshold     = "none of this rule's own"
threshold_src = """
`_form_fact` ([B9] R4, report.py): `whole-subject` is BY CONSTRUCTION a
second compiled artifact (record_schema.md §5 ADDITIONS 3, enforced by
X27); `plain` is the one ordinary artifact reached via a runtime flag.
The rule counts the two values the reporter printed.
"""
slots         = ["pattern", "regime", "n_separate", "n_same"]
arith         = [
  "n_separate / n_same: counts of the group's rankable rows by the reporter's own `fact` value",
]
template      = "{pattern} / {regime} ranks rows of BOTH facts in one group: {n_separate} `separate artifact` (whole-subject) and {n_same} `same program` (plain)."
no_fire       = "no ranking group ranks a `same program` row beside a `separate artifact` one"
links         = [
  "docs/design/record_schema.md#5. The fixed enums (OD-B4 (a))",
  "docs/dev/pcrec_references.md",
]
example       = """
reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.tsv:
orig / match-compliance ranks nine rows in ONE group (form is not in the
group key), 7 `separate artifact` and 2 `same program`; factored /
match-compliance is 3 + 2.
"""

[[rule]]
id            = "R-BUCKET-VSBEST"
