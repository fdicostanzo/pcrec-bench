since         = "1.0"
# Declared at BOTH grains although the fact is subject-grain: the rule's
# input is a subject-grain SIDECAR (`--subject-grain`), not the report
# being interpreted, so on a set-grain report the honest answer is
# `input-absent` (Q2, ruled (a)) rather than `grain`.
grain         = ["set", "subject"]
