[[rule]]
id            = "R-STATUS-5"
title         = "the query population"
class         = "status"
since         = "1.0"
grain         = ["set", "subject"]
aggregate     = []
inputs        = [
  "report:header.{source,records,superseded,newer_not_measured,excluded_invalid}",
]
predicate     = """
Any of the header's `superseded`, `newer_not_measured` or
`excluded_invalid` counts is greater than zero.
"""
threshold     = "> 0 on three header integers, definitional"
threshold_src = """
The four numbers are the reporter's own header values (report.py
render_tsv's header block; the candidate count is KB-8's
`(N record(s) matching this query)` inside `source`). "Some candidate
was not included" is exactly "one of the three counts is non-zero";
there is no tuned bound.
"""
slots         = ["candidates", "included", "superseded", "newer_not_measured", "excluded_invalid"]
arith         = [
  "candidates: the integer N in the `source` header value's `(N record(s) matching this query)`; the whole value when that shape is absent",
]
template      = "The query drew {candidates} candidate record(s) and included {included}; {superseded} superseded, {newer_not_measured} newer-but-not-measured, {excluded_invalid} invalid."
no_fire       = "the query included every candidate record it drew"
links         = []
example       = """
reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.tsv:
`source: store/index.tsv (14 record(s) matching this query); records: 9;
superseded: 5`.
"""

[[rule]]
id            = "R-STATUS-6"
title         = "a population spanning record schema versions"
class         = "status"
since         = "1.0"
grain         = ["set", "subject"]
aggregate     = []
inputs        = [
  "report:header.{schema_versions,records}",
  "report:record.{testee,metric,value}",
]
predicate     = """
The header's `schema_versions` names more than one version.
"""
threshold     = "more than one member, definitional"
threshold_src = """
`schema_versions` is the reporter's own comma-joined sorted set
(report.py render_tsv's header block). "Mixed" is "more than one
member". The `n/a (v<schema>)` agreement strings counted beside it are
`_agreement_display`'s own rendering for a record predating the v1.4
trial-agreement block (report.py `_agreement_display`).
"""
slots         = ["schema_versions", "n_pre_14", "n_records"]
arith         = [
  "n_pre_14: the count of `record` rows whose agreement value starts with the literal `n/a (v` -- `_agreement_display`'s pre-1.4 rendering, distinct from `n/a (N trials)`",
]
template      = "This report's population spans record schema versions {schema_versions}; {n_pre_14} of {n_records} record(s) predate the v1.4 trial-agreement block and read `n/a (v<schema>)` for agreement."
no_fire       = "every record in this report is at one schema version"
links         = []
example       = """
reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.tsv:
`schema_versions: 1.1,1.2`, all nine records reading `n/a (v1.1)` or
`n/a (v1.2)`.
"""

