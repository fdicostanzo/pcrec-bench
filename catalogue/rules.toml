[[rule]]
id            = "R-STATUS-9"
title         = "trial agreement reads `disagree`"
class         = "status"
since         = "1.0"
grain         = ["set", "subject"]
aggregate     = []
inputs        = [
  "report:record.{testee,metric,value}",
]
predicate     = """
A `record` row whose agreement string (the `value` column, paired with
`metric = agreement`) starts with `disagree`.
"""
threshold     = "none of this rule's own"
threshold_src = """
`reduce.agreement_line` produces five strings and the rule reads the
verdict token of one of them:
  `agree (N of N groups; …)`                 reduce.py:372-376
  `agree 0/0 groups -- nothing judged (…)`   reduce.py:371
  `disagree (N of N groups; worst …)`        reduce.py:365-369   <- fires
  `n/a (N trials)`                           reduce.py:359
  `n/a (v<schema>)`                          report.py `_agreement_display`
`n/a (v<schema>)` is provenance about a record's AGE and is reported by
R-STATUS-6, not here (§4.1, panel B2). The v1.4 rule's own constants
(k = 1.5, d_min = 2, share_c = 3, N >= 5 and odd) were MEASURED over
the store's 68 records at [B20]; this rule re-derives nothing.
"""
slots         = ["record_id", "agreement"]
arith         = []
template      = "`{record_id}`: trial agreement reads {agreement}."
no_fire       = "no record's trial agreement reads `disagree`"
links         = []
example       = """
No committed report carries a `disagree` record: the one production
firing of the v1.4 spread rule (2026-08-31) was re-measured clean per
contract. The fixture
`catalogue/fixtures/R-STATUS-9__disagree/` mutates one `record` row's
agreement string to `reduce.agreement_line`'s own disagree rendering.
"""

