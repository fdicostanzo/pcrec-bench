# The interpreter's RULE CATALOGUE — docs/design/interpreter_v1.md §3.
#
# This file is the CONTRACT `pcrecbench/interpret.py` is checked against
# (§3.2): every `[[rule]]` here has a function named `r_<id lowercased,
# hyphens to underscores>` there, every such function has a `[[rule]]`
# here, and every rule function is handed a view that raises
# `UndeclaredColumn` on any column outside that rule's own `inputs`.
#
# `predicate` is PROSE, for the reader; the executable predicate is the
# python function. `threshold_src` cites the line in
# `pcrecbench/report.py` / `pcrecbench/reduce.py` the threshold comes
# from — no rule introduces a constant of its own (§4, §13).
#
# EVERY diff that touches a `template`, `no_fire`, `no_fire_reasons`,
# `legend` or `links` field, or adds a `[[signature]]`, must carry a
# reviewer's approval line in the commit message naming the rule ids
# reviewed (§8(6)).

catalogue_version = "3.2"
# Every bump regenerates every committed sidecar in the same commit
# (§3.3). AMENDED 2026-09-19 (Frank, docs/design/predicate_audit_v1.md
# §7 Q2): the unit of compatibility is whether emitted FACTS/VERDICTS
# are comparable across the boundary, not whether a field's TEXT moved.
# MAJOR: a fact or verdict moves on UNCHANGED inputs -- a predicate or
# threshold changes, a rule is removed, `inputs` read a different
# column, a SHARED HELPER's population changes what several rules see
# (the 2.0 bump below is this shape: zero individual rule fields moved),
# or a `[[signature]]` is registered. MINOR: additive -- a rule added, a
# template's wording, a link, a `legend` line, an `example`, a
# `[[pin_order]]` append, an appended column. A field-text edit is an
# INSTANCE of MINOR, not its definition.
#
# 3.2 (2026-09-21, [B70], Frank's ruling on the [B69] census's
# `wild-codegrammar-json-number-extended` finding): MINOR, a new rule --
# R-STATUS-14, THE STANDING CHECK (`docs/design/capability_set_v1.md`
# 14): a pattern refused by every ATTEMPTING engine in a report while
# its `plain` form compiled somewhere renders `instrument-suspect`,
# never an engine verdict -- the [B69] census's CASE-1-vs-CASE-2 rule,
# re-derived here from the primary report TSV alone (no source shared
# with `tools/viewer_export.py`'s own `_fold_and_classify`, the same
# control this project's check-design rule always asks for). Additive
# per this section's own precedent (R-ARM-2, 3.0's own entry below):
# zero existing rule's predicate/threshold/inputs/slots moved; no
# golden fact re-derives except the new rule's own presence in the
# `[rule]`/`[function]` correspondence check.
