# ======================================================= class R-RANK ==

[[rule]]
id            = "R-RANK-1"
title         = "a cross-pin pair that crossed the reference arm"
class         = "rank"
since         = "1.0"
grain         = ["set"]
aggregate     = ["regime", "config"]
inputs        = [
  "report:rank?metric=ratio_vs_baseline.{pattern,regime_or_na,form,testee,rank_or_na,value}",
  "report:rank?metric=median_ns.{pattern,regime_or_na,form,testee,rank_or_na,value}",
]
predicate     = """
A cross-pin pair -- same engine and config, different version slug,
same form, one ranking group -- whose two `ratio_vs_baseline` values lie
on opposite sides of 1.0, in a group where R-STATUS-13 does not fire.
"""
threshold     = "1.0 on `ratio_vs_baseline`, DEFINITIONAL"
threshold_src = """
The reference arm IS 1.000x by construction ([B9] R5:
`ratio_b = r.median_ns / ref_ns`, report.py render_tsv's ranking
block), so "crossed the reference arm" is exactly "the ratio crossed
1". Definitional, not tuned. The guard is R-STATUS-13's own predicate:
where no rankable reference arm exists the reporter falls back to the
group's fastest row (`ref_ns = … if ref else rankable[0]…`) and the
template's `{reference}` would name a row that is not the reference.
"""
slots         = ["pattern", "regime", "form", "config", "reference", "old_pin", "old_ratio", "new_pin", "new_ratio"]
arith         = [
  "config: testee_id decomposed to (engine, mode, caps, simd, extra) with version_slug removed -- the §7.2 testee-id decomposition, splitting the config slug from the RIGHT",
  "old_pin/new_pin: the pair's two version slugs, ordered by their position in [[pin_order]]",
  "_is_reference: strip a possible `@<timestamp>` suffix, then `base.startswith(\"libpcre2_\") and \"_interp-\" in base` (report.py `_is_reference`, copied verbatim)",
]
extremal      = "new_ratio"
template      = "{pattern} / {regime} / {form} / config `{config}`: vs the reference arm `{reference}`, {old_pin} reads {old_ratio}× and {new_pin} reads {new_ratio}× — the cell crossed the reference arm between the two pins."
no_fire       = "no cross-pin pair's ratio_vs_baseline values lie on opposite sides of 1.0 in a group with a rankable reference arm"
links         = []
example       = """
reports/2026-09-06-bounded-0.3-budu-ryzen1600-after-d34c9131.tsv,
cls-upto-8192 / match-compliance / whole-subject, config
`auto-caps-simdna`: pcrec_334fd10e reads 1.788241 and pcrec_d34c9131
reads 0.269358.
"""

# ======================================================== class R-ARM ==

[[rule]]
id            = "R-ARM-1"
title         = "two arms one config token apart"
class         = "arm"
since         = "1.0"
grain         = ["set"]
aggregate     = ["arm_pair", "regime"]
inputs        = [
  "report:rank?metric=median_ns.{pattern,regime_or_na,form,testee,rank_or_na,value}",
  "report:rank?metric=stddev_ns.{pattern,regime_or_na,form,testee,value}",
]
predicate     = """
Two testee ids in one ranking group, at the same engine and version
slug, at the same form, whose config decomposes to four tokens
differing in exactly ONE, neither of them the reference arm, whose
medians differ by more than 2 × max(stddev_a, stddev_b).
"""
threshold     = "2 × max(stddev_a, stddev_b), COPIED from `_cross_pin_verdict`"
threshold_src = """
report.py `_cross_pin_verdict` ([B9] R8): `spread = max(old_stddev,
new_stddev) * 2`, `unchanged` iff `abs(diff) <= spread`. This rule
applies that identical arithmetic WITHIN a report instead of across
pins, because the reporter computes no within-report spread comparison
to read. It is the one place in the catalogue where a rule computes
rather than reads, and the bound is the copied one, not a chosen one.
"""
slots         = ["pattern", "regime", "form", "pin", "config_a", "median_a", "config_b", "median_b", "ratio", "spread", "token_name", "token_a", "token_b", "arm_pair"]
arith         = [
  "testee_id -> (engine, version_slug, mode, caps, simd, extra): record_schema.md §6.4's composition rule, splitting the config slug from the RIGHT (simd is the last hyphen field, caps the one before it, mode is everything before that, so `vm-in` keeps its hyphen); `extra` is `(none)` when absent",
  "ratio: max(median_a, median_b) / min(median_a, median_b), so it always reads >= 1",
  "spread: 2 × max(stddev_a, stddev_b) -- `_cross_pin_verdict`'s own arithmetic",
  "arm_pair: the two config slugs sorted and joined with ' vs ' -- an aggregation key, not a rendered slot",
  "_is_reference: strip a possible `@<timestamp>` suffix, then `base.startswith(\"libpcre2_\") and \"_interp-\" in base` (report.py `_is_reference`, copied verbatim)",
]
extremal      = "ratio"
template      = "{pattern} / {regime} / {form}, pin {pin}: `{config_a}` {median_a} ns vs `{config_b}` {median_b} ns — ×{ratio}, beyond 2 × max(stddev) = {spread} ns. The two arms differ in exactly one config token ({token_name}: {token_a} vs {token_b})."
no_fire       = "no two arms one config token apart differ by more than twice the larger of their two standard deviations"
links         = []
legend        = "a firing's ×N here can read close to (or exactly) ×1.00: the predicate is \"beyond 2 × max(stddev)\", i.e. the SPREAD is small, never a ratio-size threshold -- a Δ is \"beyond spread\" when the spread is small, not when the ratio is large."
example       = """
reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.tsv,
pin 692c2e8: orig / short-subject-search / plain, `vm-in-caps-simdna`
12,546.2 ns vs `vm-caps-simdna` 28,996.9 ns -- ×2.31, spread 862.2 ns.
"""

