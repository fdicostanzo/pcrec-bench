aggregate     = ["pin_slugs"]
inputs        = [
  "report:rank?metric=median_ns.{pattern,regime_or_na,form,testee,rank_or_na,value}",
]
predicate     = """
A ranking group carrying two or more distinct pcrec pin slugs.
"""
threshold     = ">= 2 distinct pin slugs, definitional"
threshold_src = """
`ratio_vs_best` is `r.median_ns / best_ns` over the group's rankable
rows (report.py render_tsv's ranking block), and the group key is
`(subbench, pattern, regime)` (report.py `_ranking_groups`) -- so a
group holding two pins ranks them against each other. "Two or more
pins" is a count of the version slugs the testee-id decomposition
yields; there is no tuned bound.
"""
slots         = ["pattern", "regime", "n_slugs", "pin_slugs"]
arith         = [
  "pin_slugs: the sorted distinct version slugs of the group's pcrec testee ids -- the §7.2 testee-id decomposition",
]
template      = "{pattern} / {regime}: this ranking group ranks {n_slugs} pcrec pin slug(s) ({pin_slugs}) together, so `ratio_vs_best` is a ratio to the fastest row in the group whichever pin carries it."
no_fire       = "no ranking group carries rows from two different pcrec pins"
links         = [
  "reports/CLAUDE.md",
]
example       = """
reports/2026-09-06-bounded-0.3-budu-ryzen1600-after-d34c9131.tsv,
cls-upto-1024 / short-subject-search: pcrec_334fd10e ranks 1 at
989.819865 ns and pcrec_d34c9131 ranks 2 at 998.441155 ns while the
same row's Δ reads `slower ×1.01`.
"""

[[rule]]
id            = "R-BUCKET-SPAN"
title         = "a cross-pin Δ spanning more than one pin"
class         = "bucket"
since         = "1.0"
grain         = ["set"]
aggregate     = ["config"]
inputs        = [
  "report:rank?metric=median_ns.{pattern,regime_or_na,form,testee,value,delta_verdict}",
  "report:excluded?metric=pass_rate.{pattern,regime_or_na,form,testee}",
  "report:record.{testee,metric}",
  "index.{path,testee_id,timestamp}",
]
predicate     = """
A cross-pin Δ whose two pins are not adjacent in `[[pin_order]]`. The Δ
partner is the reporter's own: the same (engine, config) sibling
present in this report with the latest record timestamp strictly older
than this row's.
"""
threshold     = "adjacency in `[[pin_order]]`, catalogue DATA"
threshold_src = """
The partner is `_cross_pin_info`'s own choice (report.py: same engine
and config, a different version slug, the newest record timestamp
strictly older than this testee's). Adjacency is read from this
catalogue's `[[pin_order]]` table, never inferred: `store/index.tsv`
has no pin-order column and ordering by earliest timestamp gives
STORE-adjacency, a different predicate (panel B10). A pin absent from
the table is exit 2.
"""
slots         = ["pattern", "regime", "form", "testee", "config", "old_pin", "new_pin", "span", "verdict"]
arith         = [
  "config: testee_id with version_slug removed -- the §7.2 testee-id decomposition",
  "record timestamps: the report's own `record` rows joined to `store/index.tsv` by the record id (the index's `path` basename with `.jsonl` removed), giving each testee id its record timestamp",
  "span: the distance between the two pins' positions in [[pin_order]]; 1 is adjacent and does not fire",
]
extremal      = "span"
template      = "{pattern} / {regime} / {form} / `{testee}`: the cross-pin Δ ({verdict}) pairs {old_pin} with {new_pin}, which are {span} steps apart in the catalogue's `[[pin_order]]`, so the Δ is not a one-variable comparison."
no_fire       = "every cross-pin Δ in this report pairs two pins adjacent in `[[pin_order]]`"
links         = [
  "reports/CLAUDE.md",
]
example       = """
reports/2026-09-06-bounded-0.3-budu-ryzen1600-after-d34c9131.tsv: the
`vm-in` rows' Δ partner is 288d505, not 334fd10e -- e.g. cls-upto-1024 /
large-subject-throughput / plain, `faster ×1.53`. The fact
reports/CLAUDE.md records by hand today.
"""

[[rule]]
id            = "R-BUCKET-DOMINATED"
title         = "a set cell dominated by one subject"
class         = "bucket"
since         = "1.0"
# Declared at BOTH grains although the fact is subject-grain: the rule's
# input is a subject-grain SIDECAR (`--subject-grain`), not the report
# being interpreted, so on a set-grain report the honest answer is
# `input-absent` (Q2, ruled (a)) rather than `grain`.
grain         = ["set", "subject"]
aggregate     = ["testee"]
inputs        = [
  "report:rank?metric=median_ns.{pattern,subject_or_na,regime_or_na,form,testee,value}",
]
predicate     = """
A set cell more than 90 % of whose total is one subject. Needs a
SUBJECT-GRAIN TSV, which the reporter does not commit today, so the
rule reports `input-absent` (§11 Q2, ruled (a)).
"""
threshold     = "`_DOMINANCE_SHARE = 0.90`, the reporter's own"
threshold_src = """
report.py `_DOMINANCE_SHARE = 0.90` and `_dominant_subject`'s docstring
([B16] R7): a ratio between two such sums is a real number about a real
total AND a statement about ONE subject wearing the set's name. The
rule reads the reporter's constant rather than choosing one.
"""
slots         = ["pattern", "regime", "testee", "subject", "share"]
arith         = [
  "share: the largest subject's median_ns divided by the sum of the group's subject medians, at one (pattern, regime, testee)",
]
extremal      = "share"
template      = "{pattern} / {regime} / `{testee}`: subject `{subject}` is {share} of this cell's total."
no_fire       = "no subject-grain TSV is supplied, so no set cell's subject shares can be summed"
links         = [
  "reports/CLAUDE.md",
]
example       = """
reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.
subject-grain.tsv (catalogue 2.0's first committed `.subject-grain.tsv`,
the §6 Q4 slice): `orig` / `large-subject-throughput` /
`libpcre2_10.46_interp-caps-simdna` reads `t-a-valid-addrs` at
28,731,331.9 ns against `t-b-no-at` (17,769.8 ns) and
`t-c-long-atom-run` (17,698.8 ns) -- a 99.877 % share, the rule's first
real firing. On every OTHER committed report, which carries no
`.subject-grain.tsv` (Q9: new samples plus on demand, no back-fill), the
rule still reports `input-absent`.
"""

[[rule]]
id            = "R-BUCKET-KB"
title         = "a cell matching a registered known-issue signature"
class         = "bucket"
since         = "1.0"
grain         = ["set"]
aggregate     = ["kb_id"]
inputs        = [
  "report:rank?metric=median_ns.{pattern,regime_or_na,form,testee,n_wrong,n_gave_up}",
]
predicate     = """
A cell matching a REGISTERED `[[signature]]`. **No signature is
registered in catalogue 1.0**, so the rule always reports
`no-registered-signatures`.
"""
threshold     = "each registered signature's own; none registered in 1.0"
threshold_src = """
The registration bar (§4.7, panel B4): a `[[signature]]` must name a
COLUMN-LEVEL discriminator that no other registered signature matches,
checked by `make check-interpret` against every golden report, and
registration is a MAJOR catalogue bump (§3.3). The measured reason none
is registered: the KB-13/KB-14 signature text (`expected N
non-overlapping match(es); observed M`) occurs zero times in the report
TSV and MD at any grain -- it lives in docs/dev/known_issues.md and in
the record JSONL, which §2.4 excludes -- and what the TSV does support,
`(regime, form, n_wrong > 0, n_gave_up == 0)`, cannot discriminate
KB-13's rows from KB-14's.
"""
slots         = ["kb_id", "pattern", "regime", "form", "testee", "signature"]
arith         = []
template      = "{pattern} / {regime} / {form} / `{testee}` matches the registered signature for {kb_id}: {signature}."
no_fire       = "catalogue 1.0 registers no signature"
links         = [
  "docs/dev/known_issues.md",
]
example       = """
None. §10 C.3 is a stated known gap of catalogue 1.0, not a MUST: on
reports/2026-09-07-syntax-0.1-budu-ryzen1600-first-d34c9131.tsv the
rule reports `no-registered-signatures`.
"""
