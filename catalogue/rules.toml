[[rule]]
id            = "R-STATUS-12"
title         = "one subject, two give-up codes across two patterns"
class         = "status"
since         = "1.0"
grain         = ["set"]
aggregate     = []
inputs        = [
  "report:excluded?metric=giveup_smallest.{pattern,subject_or_na,regime_or_na,form,testee,value,n}",
]
predicate     = """
One subject id that gives up under two DIFFERENT codes on two different
patterns, at one testee and one regime.
"""
threshold     = "none of this rule's own"
threshold_src = """
Precondition P-2's columns (§2.5): the reporter emits one `excluded`
row per distinct give-up code beside each base row, carrying the code
in `value`, the smallest firing subject in `subject_or_na` and its byte
count in `n` (report.py render_tsv's `giveup_smallest` block, from
`_gave_up_cell_detail`). The rule compares two code STRINGS for
inequality and parses nothing.
"""
slots         = ["subject", "subject_bytes", "code_a", "pattern_a", "code_b", "pattern_b", "testee", "regime"]
arith         = [
  "pattern_a/pattern_b: the two patterns in sorted order, so the rendering of a pair is independent of row order",
]
template      = "Subject `{subject}` ({subject_bytes} B) gives up as **{code_a}** on {pattern_a} and **{code_b}** on {pattern_b}, on `{testee}` in {regime}."
no_fire       = "no subject gives up under two different codes on two patterns at one testee and regime"
links         = [
  "docs/dev/feedback_pcrecdev1_2026-08-25-repin-v2.md#(2) STILL INTERPRETED / WRONG / AMBIGUOUS",
]
example       = """
reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.tsv:
subject `t-c-long-atom-run` (1,048,576 B) gives up as
`-2:PCREC_ERR_STEPS` on `factored` and `-4:PCREC_ERR_WORK` on `orig`,
in large-subject-throughput, on three testees.
"""

[[rule]]
id            = "R-STATUS-13"
title         = "a ranking group with no rankable reference arm"
class         = "status"
since         = "1.0"
grain         = ["set"]
aggregate     = []
inputs        = [
  "report:rank?metric=median_ns.{pattern,regime_or_na,testee,rank_or_na,value}",
]
predicate     = """
A ranking group -- (subbench, pattern, regime) at set grain -- with no
`rank` row whose testee id satisfies the reporter's own `_is_reference`.
`ratio_vs_baseline` is then a ratio to the group's BEST row, not to the
reference arm.
"""
threshold     = "none of this rule's own"
threshold_src = """
The reporter's fallback fires iff no RANKABLE reference row exists in
the group: `ref_ns = ref.median_ns if ref else (rankable[0][2].median_ns
…)` (report.py render_tsv's ranking block), where `ref` is the first
rankable row satisfying `_is_reference` (report.py `_is_reference`). A
rankable row is exactly a `rank` row, so the predicate is the
reporter's own condition, not an approximation.
"""
slots         = ["pattern", "regime", "best_testee"]
arith         = [
  "_is_reference: strip a possible `@<timestamp>` suffix, then `base.startswith(\"libpcre2_\") and \"_interp-\" in base` (report.py `_is_reference`, copied verbatim)",
  "best_testee: the group's rank-1 row's testee -- the row `ref_ns` falls back to",
]
template      = "{pattern} / {regime}: no reference arm is rankable in this group, so `ratio_vs_baseline` is a ratio to the group's fastest row (`{best_testee}`), not to the reference arm. R-RANK-1 does not fire in this group."
no_fire       = "every ranking group in this report carries a rankable reference arm"
links         = []
example       = """
reports/2026-09-05-altwide-0.2-budu-ryzen1600-after-334fd10e.tsv is
where these concentrate: libpcre2 refuses the wide rungs at its own
compiled-size ceiling, so a group above the wall ranks pcrec against
pcrec.
"""

# ====================================================== class R-DELTA ==

[[rule]]
id            = "R-DELTA-1"
title         = "cross-pin Δ outside spread"
class         = "delta"
since         = "1.0"
grain         = ["set"]
aggregate     = ["regime", "config", "direction"]
inputs        = [
  "report:rank?metric=median_ns.{pattern,regime_or_na,form,testee,rank_or_na,value,delta_verdict}",
  "report:rank?metric=stddev_ns.{pattern,regime_or_na,form,testee,value}",
]
predicate     = """
Any `; `-separated clause of `delta_verdict` matching `^(faster|slower) ×`.
"""
threshold     = "none of this rule's own"
threshold_src = """
report.py `_cross_pin_verdict` ([B9] R8): `unchanged (within spread)`
iff |median_new - median_old| <= 2 * max(stddev_old, stddev_new);
otherwise faster/slower ×N.NN. This rule adds NO threshold of its own --
it reads the verdict clause the reporter already computed and printed,
so the interpreter and the report can never disagree about what "beyond
spread" means.
"""
slots         = ["pattern", "regime", "form", "testee", "verdict", "median_ns", "config", "direction", "ratio"]
arith         = [
  "config: testee_id with version_slug removed -- the §7.2 testee-id decomposition, same split minus the version_slug field",
  "direction: the matched clause's own leading token ('faster' or 'slower'), copied verbatim from the predicate's own match",
  "ratio: the matched clause's own trailing '×N.NN', parsed as a float, copied verbatim from the predicate's own match",
]
extremal      = "ratio"
template      = "{pattern} / {regime} / {form} / `{testee}`: the reporter's cross-pin Δ reads **{verdict}** (median {median_ns} ns)."
no_fire       = "no rank row carries a faster/slower clause"
links         = []
example       = """
reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.tsv,
factored / short-subject-search / plain /
pcrec_692c2e8_vm-caps-simdna, rank 5: median 69,537.5 ns,
delta_verdict `faster ×1.19`.
"""

