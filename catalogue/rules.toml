[[rule]]
id            = "R-STATUS-5"
title         = "the query population"
class         = "status"
since         = "1.0"
grain         = ["set", "subject"]
aggregate     = []
inputs        = [
  "report:header.{source,records,superseded,newer_not_measured,excluded_invalid}",
]
predicate     = """
Any of the header's `superseded`, `newer_not_measured` or
`excluded_invalid` counts is greater than zero.
"""
threshold     = "> 0 on three header integers, definitional"
threshold_src = """
The four numbers are the reporter's own header values (report.py
render_tsv's header block; the candidate count is KB-8's
`(N record(s) matching this query)` inside `source`). "Some candidate
was not included" is exactly "one of the three counts is non-zero";
there is no tuned bound.
"""
slots         = ["candidates", "included", "superseded", "newer_not_measured", "excluded_invalid"]
arith         = [
  "candidates: the integer N in the `source` header value's `(N record(s) matching this query)`; the whole value when that shape is absent",
]
template      = "The query drew {candidates} candidate record(s) and included {included}; {superseded} superseded, {newer_not_measured} newer-but-not-measured, {excluded_invalid} invalid."
no_fire       = "the query included every candidate record it drew"
links         = []
example       = """
reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.tsv:
`source: store/index.tsv (14 record(s) matching this query); records: 9;
superseded: 5`.
"""

