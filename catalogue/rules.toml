# ===================================================== class R-STATUS ==

[[rule]]
id            = "R-STATUS-1"
title         = "an included record whose status is not `measured`"
class         = "status"
since         = "1.0"
grain         = ["set", "subject"]
aggregate     = ["status"]
inputs        = [
  "report:record.{testee,metric}",
  "index.{path,testee_id,status}",
]
predicate     = """
An included `record` row whose record id joins to a `store/index.tsv`
row with `status` other than `measured`.
"""
threshold     = "none of this rule's own"
threshold_src = """
The status token is `store/index.tsv`'s own column, written by
`pcrecbench/store.py` from the record's `run.status` (schema v1.4's
decision table, docs/design/gate_shape_v14.md). The rule compares it
against the literal `measured` and adds no threshold.
"""
slots         = ["record_id", "testee", "status"]
arith         = [
  "record_id: the `record` row's `testee` column, which carries the RECORD ID (report.py render_tsv's record block) -- joined to the index by `path`'s basename with `.jsonl` removed (interpreter_v1.md 2.2, the only join)",
]
template      = "`{record_id}` (testee `{testee}`) is included with status **{status}**."
no_fire       = "every included record joins to an index row whose status is `measured`"
links         = []
example       = """
No committed report exercises this rule: every committed query names its
roster and its window, so `include_unmeasured` is False on all 42 and a
non-`measured` record is never drawn. The fixture
`catalogue/fixtures/R-STATUS-1__included-not-measured/` mutates one
index row's `status` to `inconclusive-spread`.
"""

[[rule]]
id            = "R-STATUS-2"
title         = "a non-measured record outside this report's population"
class         = "status"
since         = "1.0"
grain         = ["set", "subject"]
aggregate     = ["status"]
inputs        = [
  "report:header.{subbench_versions,machines}",
  "report:record.{testee,metric}",
  "index.{path,subbench,version,testee_id,machine_id,timestamp,status}",
]
predicate     = """
A `store/index.tsv` row for one of this report's (subbench, version,
machine) triples whose status is not `measured` and whose record id is
not among the report's own `record` rows.
"""
threshold     = "none of this rule's own"
threshold_src = """
As R-STATUS-1: the index's own `status` column against the literal
`measured`. The population is the header's own `subbench_versions` and
`machines` values (report.py render_tsv's header block).
"""
slots         = ["record_id", "testee", "timestamp", "subbench", "version", "machine", "status"]
arith         = [
  "subbench/version: each `subbench_versions` header member split at the last `@` -- the reporter joins them with `,` and spells each `<subbench>@<version>`",
  "record_id: the index `path`'s basename with `.jsonl` removed",
]
template      = "`{record_id}` (testee `{testee}`, {timestamp}) is in store/index.tsv for {subbench}@{version} on {machine} with status **{status}** and is NOT in this report's population."
no_fire       = "every index row for this report's (subbench, version, machine) population is either included or `measured`"
links         = []
example       = """
reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.tsv:
store/index.tsv carries 14 rows for email-specimen@0.1 on
budu-ryzen1600, of which three are `inconclusive-load` (interp @
17:34:02Z, auto-caps @ 17:51:31Z, auto-nocaps @ 17:55:34Z) and appear
nowhere in the report -- each superseded by a `measured` record of the
same testee that evening.
"""

[[rule]]
id            = "R-STATUS-3"
title         = "a cell excluded from ranking"
class         = "status"
since         = "1.0"
grain         = ["set", "subject"]
aggregate     = []
inputs        = [
  "report:excluded?metric=pass_rate.{pattern,regime_or_na,form,testee,pass_rate,n_gave_up,n_wrong,gave_up_summary}",
]
predicate     = """
An `excluded` section row whose `metric` is `pass_rate` -- the BASE row.
Precondition P-2's `giveup_smallest` rows land in the same section and
are R-STATUS-12's input, never this rule's (§4.1, cross-review I-58).
"""
threshold     = "none of this rule's own"
threshold_src = """
The section is the reporter's own: `r.expectation_failing or not
n_timed` (report.py render_tsv's rankable/others split), NOT
`pass_rate < 1`. The rule reads the section and the columns beside it
and computes nothing.
"""
slots         = ["pattern", "regime", "form", "testee", "pass_rate", "n_wrong", "n_gave_up", "gave_up_summary"]
arith         = []
template      = "{pattern} / {regime} / {form} / `{testee}` is EXCLUDED from ranking: pass-rate {pass_rate}; {n_wrong} wrong answer(s); {n_gave_up} give-up trial(s); give-up summary {gave_up_summary}. (`n_gave_up` counts TRIALS; a `×N` in the summary counts SUBJECTS.)"
no_fire       = "no cell is excluded from ranking in this report"
links         = []
example       = """
reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.tsv:
13 base rows, e.g. `factored / large-subject-throughput / plain /
libpcre2_10.46_jit-caps-simdna`, pass-rate 0.6667, 0 wrong, 0 give-up
trials, summary `0` -- a row whose exclusion cause the TSV does not
carry, rendered without a fabricated cause.
"""

