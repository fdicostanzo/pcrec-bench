# The FIXTURE DECLARATION — docs/design/interpreter_v1.md §8(4).
#
# The precedent is `schema/examples/bad/`'s (the Makefile's own
# check-schema comment): a GENERATED BASE plus ONE DECLARED MUTATION,
# pinned by `gen.py --check`, never ~190 hand-typed files that would
# carry combinations `render_tsv` cannot emit.
#
# Each `[[fixture]]` becomes `catalogue/fixtures/<name>/` holding its own
# `source.toml` (this entry, materialised) and the GENERATED
# `report.tsv` / `index.tsv` (and `predictions.tsv` where declared).
# A fixture naming `base` is its base's CONTROL: `gen.py --check`
# asserts that EXACTLY ONE declared field differs between the two --
# the computable replacement for "the minimum number of bytes" -- and
# `check_interpret.py` asserts the rule fires on one and not the other.
#
# `select` filters DATA rows: a row is kept when every named column
# either equals the value (or is one of a list) or is EMPTY on that row,
# so a `pattern`-scoped slice still carries the population's `record`
# rows. The index slice keeps the rows for the report's own
# (subbench, version, machine).

report_a = "reports/2026-08-25-email-specimen-0.1-budu-ryzen1600-repin-692c2e8.tsv"
report_b = "reports/2026-09-06-bounded-0.3-budu-ryzen1600-after-d34c9131.tsv"
report_c = "reports/2026-09-07-syntax-0.1-budu-ryzen1600-first-d34c9131.tsv"
# R-ARM-2 (F9)'s own real witness: the pin 35e1ab1 first sample, where
# `level-context` ranks under `vm-caps-simdna` and did-not-compile under
# `auto-caps-simdna` -- one config token apart, at large-subject-throughput.
report_d = "reports/2026-08-28-loglines-0.1-budu-ryzen1600-first-sample-35e1ab1.tsv"
# [B79] (catalogue 3.7): the first reporter-v22 CROSS-PIN render, the real
# witness for R-DELTA-5 (`d119` rows) and R-STATUS-15 (the I-101 query
# with its computed clearance): capability@0.1, 8d716693 -> b1885a83.
report_e = "reports/2026-09-23-capability-0.1-budu-ryzen1600-after-b1885a83.tsv"
index    = "catalogue/golden/index@2026-09-09.tsv"
predictions = "docs/dev/predictions/syntax-0.1-first.tsv"

